# Example configuration for "cartographer serve --config config.yaml".
# Generated from the settings schema (internal/config/schema.go) by "make settings-example": edit the schema, not this file.
# Every key is optional. Precedence, highest first: flag, environment variable, this file, default.

# Listen address of the HTTP transport, for example :39273. Empty serves MCP
# over stdio.
# Default: "". Env: CARTOGRAPHER_HTTP. Flag: --http. Needs a restart.
http: ":39273"
# Initialize a KB that does not exist yet instead of failing.
# Default: false. Flag: --init. Needs a restart.
init: true
# Directory whose direct subdirectories are discovered as KBs, and where
# remote KBs are cloned.
# Default: "". Env: CARTOGRAPHER_DATA. Flag: --data. Needs a restart.
data: /data
auth:
  # Bearer-token authentication of the HTTP transport. auto turns it on when at
  # least one token is configured.
  # Values: on | off | auto
  # Default: auto. Env: CARTOGRAPHER_AUTH. Needs a restart.
  mode: auto
  # --- available settings ---
  # Bearer tokens: a bare string (admin, every KB) or a mapping with token,
  # scopes (kb:<name>:r or kb:<name>:rw), roles, id, author_name and
  # author_email. A token may be written ${NAME} to read it from the
  # environment.
  # Default: []. Env: CARTOGRAPHER_TOKENS. Flag: --tokens. Needs a restart.
  # Secret: keep it out of version control.
  # tokens: []
  # Named permission sets that tokens reference by name; each has a name and
  # rules (kb, access r or rw, and optional maps, journals, types).
  # Default: []. Needs a restart.
  # roles: []
# The KBs to clone and mount: each entry has a remote. A KB that is a folder
# under data is discovered and needs no entry. KBs from
# CARTOGRAPHER_KB_REMOTES are added to this list.
# Default: []. Env: CARTOGRAPHER_KB_REMOTES. Needs a restart.
kbs:
  # Git remote a KB is cloned from, under data. A KB with a remote syncs with
  # it; one without never contacts anything.
  # Default: "".
  - remote: https://git.example.com/user/kb-a.git
    # KB name, in place of the one derived from the remote. It drives the
    # endpoint, the token scopes, the clone directory and the token and age-key
    # file conventions.
    # Default: "".
    name: kb-a
web:
  # Serve the read-only Atlas UI at /ui/ and its API at /api/ui/v1 in HTTP mode.
  # false removes both routes.
  # Default: true. Env: CARTOGRAPHER_WEB_ENABLED. Flag: --web-enabled. Needs a
  # restart.
  enabled: true

# --- available settings ---
# Look up the latest release once a day and report it in /health and kb_status
# when it is newer; the Atlas reads the release history from the same GitHub
# list when someone opens it. Off, the server makes neither call. A dev build
# never checks.
# Default: true. Env: CARTOGRAPHER_UPDATE_CHECK. Flag: --update-check. Needs a
# restart.
# update_check: true
# Old names of renamed KBs: each item has a from (the old name) and a to (the
# KB now mounted), so a routed ?kbs=<from> still reaches it. `kb rename`
# writes it. One step only, and a mounted name wins over an alias.
# Default: []. Needs a restart.
# kb_aliases: []
# git:
#   SSH private key used to reach remote KBs.
#   Default: "". Needs a restart.
#   ssh_key: ""
#   The known_hosts file used to reach remote KBs.
#   Default: "". Needs a restart.
#   known_hosts: ""
#   Directory with one file per KB, <token_dir>/<name>.token (its trimmed
#   content is the token), used as HTTPS git credentials for that KB's remote.
#   Default: "". Env: CARTOGRAPHER_GIT_TOKEN_DIR. Needs a restart.
#   token_dir: ""
# audit:
#   Path of the append-only operation log. Empty turns the audit trail off.
#   Default: "". Env: CARTOGRAPHER_AUDIT_LOG. Needs a restart.
#   log: ""
#   Seed that signs the audit trail, so it is tamper-evident. Write it ${NAME}
#   to read it from the environment.
#   Default: "". Env: CARTOGRAPHER_AUDIT_KEY. Needs a restart. Secret: keep it
#   out of version control.
#   key_seed: ""
#   With best_effort a failed append is logged and the call carries on; with
#   required the call is rejected before the tool runs.
#   Values: best_effort | required
#   Default: best_effort. Needs a restart.
#   mode: best_effort
#   Size after which the active log segment is rotated.
#   Values: bytes; 0 keeps the built-in size
#   Default: 0. Needs a restart.
#   max_segment_bytes: 0
#   Directory of rotated segments; empty keeps them beside the log.
#   Default: "". Needs a restart.
#   archive_dir: ""
#   Rotated segments older than this are deleted once their checkpoint is
#   written.
#   Values: days; 0 keeps everything
#   Default: 90. Needs a restart.
#   retention_days: 90
# sops:
#   Default age key that decrypts secret references, for every KB without its
#   own.
#   Default: "". Env: CARTOGRAPHER_SOPS_AGE_KEY_FILE. Needs a restart.
#   age_key_file: ""
#   Directory with one age key per KB, <age_key_dir>/<name>.age. Resolution:
#   kbs[].sops_age_key_file, then this, then age_key_file.
#   Default: "". Env: CARTOGRAPHER_SOPS_AGE_KEY_DIR. Needs a restart.
#   age_key_dir: ""
# tools:
#   Which tools tools/list advertises. agent is the core set; full advertises
#   every tool. Hidden tools stay callable.
#   Values: agent | full
#   Default: agent. Env: CARTOGRAPHER_TOOLS_PROFILE. Flag: --tools-profile.
#   Needs a restart.
#   profile: agent
# mcp:
#   Browser origins allowed to reach the MCP endpoint. Empty accepts only an
#   Origin matching the request's own Host; * accepts any. A request with no
#   Origin header is unaffected.
#   Values: origins with scheme and port, or *
#   Default: []. Env: CARTOGRAPHER_MCP_ALLOWED_ORIGINS. Needs a restart.
#   allowed_origins: []
