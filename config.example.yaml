# Example configuration for "cartographer serve --config config.yaml".
# Generated from the settings schema (internal/config/schema.go) by "make settings-example": edit the schema, not this file.
# Every key is optional. Precedence, highest first: flag, environment variable, this file, default.

# Listen address of the HTTP transport, for example :39273. Empty serves MCP
# over stdio.
# Default: none · Env CARTOGRAPHER_HTTP · flag --http · needs a restart
http: ":39273"

# Directory whose direct subdirectories are discovered as KBs, and where
# remote KBs are cloned. The name credentials is the server's own and is never
# discovered.
# Default: none · Env CARTOGRAPHER_DATA · flag --data · needs a restart
data: /data

# Directory with every secret file, looked up by KB name: <kb>.ssh, <kb>.token
# and <kb>.age (each with a default.* for the KBs without their own),
# <kb>.signing (the artifact signing seed, no default) and known_hosts (one
# file for every remote). On Kubernetes it is one mounted Secret (defaultMode
# 0440 with the pod's fsGroup). A file readable by other users, or by the
# group when it is the server's own, is warned about once at start.
# Default: <data>/credentials · Env CARTOGRAPHER_CREDENTIALS_DIR ·
# needs a restart
credentials_dir: /etc/cartographer/credentials

maintenance:
  # Run the safe repairs of every KB in the background, once a day and after a
  # pull that changed it. false stops that timer only: repair on write, the
  # write gate and kb_repair are not affected. While a live Surveyor declaring
  # the repair task keeps repairing a KB, the timer skips that KB.
  # Default: true · Env CARTOGRAPHER_MAINTENANCE_AUTO_REPAIR · needs a restart
  auto_repair: true

auth:
  # Bearer-token authentication of the HTTP transport. auto turns it on when at
  # least one token is configured.
  # Values: on | off | auto · Default: auto · Env CARTOGRAPHER_AUTH ·
  # needs a restart
  mode: auto

  # How often a running server looks at the config file for a changed auth
  # section (tokens, roles) and applies it without a restart. 0 stops the
  # polling; SIGHUP reloads at any time. A reload that fails validation, or that
  # changes the auth mode, is refused and the tokens in force are kept.
  # Default: 30s · needs a restart
  reload_interval: 30s

  # --- available settings: uncomment a key to set it ---

  # Bearer tokens: a bare string (admin, every KB) or a mapping with token,
  # scopes (kb:<name>:r or kb:<name>:rw), roles, id, kind (human, client or
  # surveyor) expires_at (RFC 3339; required for client and surveyor, which are
  # never admin) and proxy (true for the bearer of the SSO proxy of
  # auth.proxy_identity). A token may be written ${NAME} to read it from the
  # environment. A running server picks up a changed list without a restart, at
  # the next poll of the file or on SIGHUP (auth.reload_interval).
  # Env CARTOGRAPHER_TOKENS · flag --tokens ·
  # secret: keep it out of version control
  # tokens:
  #   - token: ${CARTOGRAPHER_TOKEN_CI}
  #     id: ci
  #     scopes: [kb:kb-a:rw]
  #   - ${CARTOGRAPHER_TOKEN_ADMIN}

  # Named permission sets that tokens reference by name; each has a name and
  # rules (kb, access r or rw, and optional maps, journals, types, artifacts: r
  # to withhold the skill, agent and hook write tools from a rule that otherwise
  # writes, and secrets: none to withhold the secret tools and the concept
  # fields that point at a secret). A role may take its rules from a role of a
  # pinned plugin instead (from: <plugin>/<role>, kbs: the KBs they apply to,
  # one copy of each rule per KB); the plugin supplies the template and only the
  # roles you name here, on the tokens you give them, apply. A running server
  # picks up a change without a restart.
  # roles:
  #   - name: runbook-editor
  #     rules:
  #       - kb: kb-a
  #         access: rw
  #         maps: [infra]
  #         types: [Runbook]

  # Per-user identity behind an SSO proxy. The proxy authenticates with a token
  # declared proxy: true (never admin; its scopes or roles are the ceiling of
  # every person behind it) and names the person in a header; the server
  # believes the header only from trusted_addresses and on that token. The
  # groups map to roles through group_roles. A running server picks up a change
  # without a restart.
  # proxy_identity:
  #   CIDRs (or addresses) of the proxy's TCP peer; required. A /0 prefix is
  #   refused and loopback is not implied. X-Forwarded-For is never used.
  #   trusted_addresses: [192.0.2.10/32]
  #
  #   Header carrying the person's name; required. The proxy must overwrite it on
  #   every inbound request. At most 128 bytes, printable, no angle brackets.
  #   user_header: ""
  #
  #   Header carrying the person's groups (at most 64 of 128 bytes); without it
  #   nobody maps to a role.
  #   groups_header: ""
  #
  #   Separator of the groups header.
  #   groups_separator: ","
  #
  #   Group name to the roles it grants. A person's permissions are the union of
  #   their groups' roles, clamped by the proxy token's own; no mapped group is a
  #   403.
  #   group_roles:
  #     staff: [runbook-editor]

# The KBs to clone and mount: each entry has a remote. A KB that is a folder
# under data is discovered and needs no entry. KBs from
# CARTOGRAPHER_KB_REMOTES are added to this list (bare remotes: name and
# branch need the file).
# Env CARTOGRAPHER_KB_REMOTES · needs a restart
kbs:
  # Git remote a KB is cloned from, under data. A KB with a remote syncs with
  # it; one without never contacts anything.
  # Default: none
  - remote: https://git.example.com/user/kb-a.git

    # KB name, in place of the one derived from the remote. It drives the
    # endpoint, the token scopes, the clone directory and the names of the KB's
    # files in credentials_dir.
    # Default: none
    name: kb-a

    # Branch this server alone commits and pushes to, in place of the KB's own
    # branch setting (which is then not read); the first push creates it. Empty
    # keeps the KB's setting, and without one the remote's default branch. Only
    # here, in the file: CARTOGRAPHER_KB_REMOTES has no per-entry option.
    # Default: none · needs a restart
    branch: try-cartographer

web:
  # Serve the read-only Atlas UI at /ui/ and its API at /api/ui/v1 in HTTP mode.
  # false removes both routes.
  # Default: true · Env CARTOGRAPHER_WEB_ENABLED · flag --web-enabled ·
  # needs a restart
  enabled: true

feedback:
  # Where agent bug and idea reports go. github opens a prefilled issue on the
  # public repository; off removes the offer lines from the served instructions
  # and the hint on internal errors; an https:// URL template (it must contain
  # {title}) points agents at an internal tracker. Nothing is ever sent by the
  # server.
  # Values: github | off | URL template with {kind}, {title}, {body} ·
  # Default: github · Env CARTOGRAPHER_FEEDBACK_DESTINATION · needs a restart
  destination: github

api:
  # Serve the public read-only API at /api/v1 in HTTP mode, independent of
  # web.enabled. Off by default: nothing is exposed until set.
  # Default: false · Env CARTOGRAPHER_API_ENABLED · flag --api-enabled ·
  # needs a restart
  enabled: false

  # --- available settings: uncomment a key to set it ---

  # Browser origins allowed to read /api/v1, each scheme://host[:port] (http or
  # https, no path, no *). Empty allows none.
  # Needs a restart
  # cors_origins: []

  # Concurrent event streams one token may hold open on /api/v1.
  # Values: 1 or more, at most api.max_streams · needs a restart
  # max_streams_per_token: 4

  # Concurrent event streams the server holds open on /api/v1.
  # Values: at least api.max_streams_per_token · needs a restart
  # max_streams: 64

# --- available settings: uncomment a key to set it ---

# Look up the latest release once a day and report it in /health and kb_status
# when it is newer; the Atlas reads the release history from the same GitHub
# list when someone opens it. Off, the server makes neither call. A dev build
# never checks.
# Env CARTOGRAPHER_UPDATE_CHECK · flag --update-check · needs a restart
# update_check: true

# git:
#   The git identity, Name <email>, the server commits as, per KB name; the key
#   default stands for every KB without an entry. A present empty entry means
#   that KB has none and commits as the server identity. The identities are the
#   author and the committer of the commits the server makes with no writer of
#   their own (the unattended repair, merges, conflict resolution) and of a
#   write whose client sends no valid Cartographer-Author. Set one when the
#   remote's forge rejects commits whose author or committer is not one of its
#   accounts. Without an entry the server identity applies, Cartographer
#   <cartographer@host>.
#   Needs a restart
#   identities:
#     kb-a: Ada Example <ada@work.example.com>
#     default: Ada Example <ada@example.com>

# audit:
#   Path of the append-only operation log, which is always on and signed with
#   audit.key from credentials_dir (generated at the first start). Empty keeps
#   it at <data>/audit/audit.log.
#   Env CARTOGRAPHER_AUDIT_LOG · needs a restart
#   log: ""
#
#   With best_effort a failed append is logged and the call carries on, and a
#   log or key the server cannot open is a warning at start; with required the
#   call is rejected before the tool runs, and the server does not start without
#   its signed log.
#   Values: best_effort | required · needs a restart
#   mode: best_effort
#
#   Size after which the active log segment is rotated (64 MiB by default), so
#   retention has segments to delete.
#   Values: bytes; 0 keeps the default · needs a restart
#   max_segment_bytes: 67108864
#
#   Directory of rotated segments; empty keeps them beside the log.
#   Needs a restart
#   archive_dir: ""
#
#   Rotated segments older than this are deleted once their checkpoint is
#   written.
#   Values: days; 0 keeps everything · needs a restart
#   retention_days: 90

# The components the server expects to hear from. A declared Surveyor with
# fewer live replicas than min_replicas is degraded, one with none is silent
# (an alarm in the components view; /health and /ready do not change); for the
# first minutes after a start it is starting. Absent or empty: no expectation
# and no alarm. YAML only (a list of mappings has no environment or flag
# form), and the Helm chart does not render it yet.
# Needs a restart
# components:
#   - kind: surveyor
#     name: nightly
#     kbs: [kb-a]
#     min_replicas: 1

# The read-only store the pinned plugins are read from:
# <dir>/<name>/<digest>/, filled by cartographer plugin vendor. The server
# never writes into it and never fetches. Required when plugins is set. YAML
# only.
# Values: absolute path · needs a restart
# plugins_dir: ""

# Plugins whose server side this server loads, by plugin name: the digest
# pinned here is the only consent. At start a tree whose digest differs, or a
# plugin that is missing, has no server side or cannot load here, stops the
# server with the plugin named; a changed plugin needs a new digest and a
# restart. Empty: the server loads no plugin. YAML only.
# Needs a restart
# plugins:
#   {name}:
#     Tree digest of the approved plugin, as printed by cartographer plugin
#     vendor. Required.
#     Values: 64 lowercase hex · needs a restart
#     digest: ""
#
#     Set to false to skip the pin: the tree is not read, but the name and digest
#     are still validated.
#     Needs a restart
#     enabled: true
#
#     Scalar settings handed to the plugin, typed by the settings its manifest
#     declares.
#     Needs a restart
#     settings: {}
