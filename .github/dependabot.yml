version: 2
updates:
  # No npm entry for web/: package-lock.json is hashed into the committed
  # bundle's provenance, so a bot bump without `make web` fails `test`.
  # npm security alerts are fixed by hand (docs/deployment.md).
  # Grouped weekly PRs: one chore(deps) entry per round in the release-please
  # changelog instead of one per dependency.
  # `cooldown` holds a new release back a few days before Dependabot proposes it:
  # a compromised release is usually yanked within that window (D1020).
  - package-ecosystem: gomod
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      go-dependencies:
        patterns: ["*"]
  # Actions are pinned by SHA with a `# vX.Y.Z` comment; Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      github-actions:
        patterns: ["*"]
  # Base images are pinned by digest; these PRs are never auto-merged
  # (dependabot-automerge.yml), the `docker` job is not a required check.
  - package-ecosystem: docker
    directories: ["/", "/deploy/demo"]
    labels: ["dependencies"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      docker-images:
        patterns: ["*"]
