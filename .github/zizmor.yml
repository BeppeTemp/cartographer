# zizmor suppressions (D1020). Every entry says why; a new finding is fixed, not
# added here, unless it is the same kind of accepted exception.
rules:
  dangerous-triggers:
    ignore:
      # Documented invariants and a test (docs/decisions): it reads the issue
      # label and PR metadata only, and never checks out or runs PR code.
      - plan-gate.yml
      # Runs a guard scoped to actors with write access; no PR code is involved.
      - privacy.yml
      # workflow_run of release-train only (schedule/dispatch, never a PR); it
      # checks out main without credentials and interpolates no event field into
      # a run step (D1180).
      - dependabot-arm.yml
  self-repository:
    ignore:
      # Help-level style hint: the local ./ reusable-workflow path is what the
      # release workflow wants (it runs the tag's own copy).
      - release.yml
      # Same reason: the film job calls ./.github/workflows/film.yml, the
      # candidate's own copy of the called workflow.
      - preview.yml
