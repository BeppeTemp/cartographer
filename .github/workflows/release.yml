name: Release

on:
  push:
    # A release candidate's tag (vX.Y.Z-rc.<date>, D1192), or any tag preview.yml
    # accepts (vX.Y.Z-<suffix>), never runs a release, even when pushed by a token
    # that starts workflows: a stable tag has no hyphen, the update channel's rule.
    tags: ["v*", "!v*-*"]

permissions:
  contents: read

jobs:
  # Binaries + SBOMs + checksums attached to the release-please release, plus
  # the Homebrew formula pushed to BeppeTemp/homebrew-tap. Windows has no package
  # manager channel: install.ps1 reads the release assets directly (D252). Every
  # asset carries a keyless build-provenance attestation (D1022).
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache: this job publishes what it builds (D1020).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # goreleaser's `sboms:` shells out to syft. Pinned by version and by the
      # sha256 of the archive, as mcp-publisher below (D1020); a bump is a
      # reviewed edit of both lines.
      - name: Install syft
        env:
          SYFT_VERSION: v1.55.0
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" syft
          install -m 0755 syft /usr/local/bin/syft
          rm "$archive" syft
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # The release must still be a draft here (D1350): if GoReleaser had published
      # it or created a second release, fail before anything announces it. Drafts
      # are looked up through the releases listing, never by tag (that endpoint
      # does not return them).
      - name: Check the release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rel=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          if [ "$(printf '%s\n' "$rel" | grep -c .)" != 1 ] || [ "${rel#* }" != true ]; then
            echo "::error::$TAG must be exactly one draft release after GoReleaser (D1350), got: ${rel:-none}" >&2
            exit 1
          fi
      # sha256sums.txt lists every other published asset (binaries, Windows zips,
      # SBOMs) with its digest, so one attestation covers them all, and a second
      # covers the file itself (D1022). Names are not what verification matches:
      # `gh attestation verify <file>` looks the file's digest up.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/sha256sums.txt
      - name: Attest the checksum file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sha256sums.txt

  # The beta marker on the release itself (D82), which nothing was actually
  # setting: `"prerelease": true` in release-please-config.json does not put the
  # flag on the GitHub release, and had not since v0.2.0 — the only two releases
  # carrying it, v0.1.0 and v0.1.1, were marked by hand. See D211.
  #
  # This job owns the flag and then *verifies* it, so the mechanism cannot fail
  # silently a second time: an unset flag on a 0.x tag fails the release.
  # At 1.0.0 the condition stops matching on its own, and a stable tag is
  # asserted the other way round rather than left unchecked.
  prerelease-flag:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: write
    steps:
      - name: Mark a 0.x release as a pre-release, and verify it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v0.*) want=true ;;
            *)    want=false ;;
          esac
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ -z "$id" ] || [ "$(printf '%s\n' "$id" | wc -l)" != 1 ]; then
            echo "::error::no single release for $TAG" >&2
            exit 1
          fi
          # By id: the release is a draft (D1350) and the tag endpoint hides drafts.
          if [ "$want" = true ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F prerelease=true > /dev/null
          fi
          got=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .prerelease)
          if [ "$got" != "$want" ]; then
            echo "::error::$TAG is isPrerelease=$got, want $want (D82/D211)" >&2
            exit 1
          fi
          echo "$TAG: isPrerelease=$got"

  # The release-please release is created as a draft (D1350), so the update check
  # and every client skip it until this job: it runs only when the binaries and
  # the Homebrew cask (goreleaser), the pre-release flag and the image (docker)
  # all exist, and un-drafts the release. A failed or retried job above leaves
  # the release a draft instead of announcing a version no channel can install.
  # Un-drafting keeps the pre-release flag; it is read back
  # because a 0.x release must stay a Pre-release (D82/D211).
  publish:
    runs-on: ubuntu-latest
    needs: [goreleaser, prerelease-flag, docker]
    permissions:
      contents: write
    steps:
      - name: Publish the release, and verify it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v0.*) want=true ;;
            *)    want=false ;;
          esac
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ -z "$id" ] || [ "$(printf '%s\n' "$id" | wc -l)" != 1 ]; then
            echo "::error::no single release for $TAG" >&2
            exit 1
          fi
          # By id: the tag endpoint does not return a draft.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false > /dev/null
          got=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '"\(.draft) \(.prerelease)"')
          if [ "$got" != "false $want" ]; then
            echo "::error::$TAG is isDraft/isPrerelease=$got, want false $want (D1350, D82)" >&2
            exit 1
          fi
          echo "$TAG: published (isDraft/isPrerelease=$got)"

  # Multi-arch server image on ghcr.io.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/beppetemp/cartographer:${{ github.ref_name }}
            ghcr.io/beppetemp/cartographer:latest
      # The digest is the one buildx pushed (the image index), so the signature
      # holds for :<tag> and :latest alike (D1022).
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/beppetemp/cartographer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Live read-only MCP demo on Cloud Run (D751). Skipped until the repository
  # variables exist; nothing waits on it, so a demo failure never blocks the
  # MCP Registry entry.
  demo:
    needs: docker
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/demo.yml
    with:
      tag: ${{ github.ref_name }}

  # Re-records the README hero when the release changed the Atlas (D790). It
  # builds from the tag's source, so it waits for nothing, and a failed recording
  # never blocks a release.
  hero:
    permissions:
      contents: write
    uses: ./.github/workflows/hero.yml
    with:
      tag: ${{ github.ref_name }}

  # Metadata entry in the official MCP Registry, pointing at the ghcr image
  # (ownership verified via the io.modelcontextprotocol.server.name LABEL). It
  # announces the version, so it waits for `publish` like the update check does
  # (D1350).
  mcp-registry:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by version and by the sha256 of the archive, never `releases/latest`
      # (D1020): this job runs the binary with `id-token: write`. A bump is a
      # reviewed edit of both lines; the digest is the one GitHub shows on the asset.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" mcp-publisher
          rm "$archive"
      - name: Set version in server.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" --arg img "ghcr.io/beppetemp/cartographer:${GITHUB_REF_NAME}" \
            '.version = $v | .packages[0].identifier = $img' server.json > server.tmp && mv server.tmp server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  # The candidates of this version leave with its release (D1192): every
  # pre-release vX.Y.Z-rc.<YYYYMMDD> of the version shipped is deleted, with its
  # tag; candidates of other versions stay. Never fails the release: a candidate
  # left behind is a warning, and the update channel skips it anyway.
  candidate-cleanup:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: write
    steps:
      - name: Delete this version's release candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          version=$(printf '%s' "$TAG" | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p')
          if [ -z "$version" ]; then
            echo "::warning::$TAG is not vX.Y.Z: no candidate cleanup"
            exit 0
          fi
          pattern="^v${version//./\\.}-rc\\.[0-9]{8}$"
          tags=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' | grep -E "$pattern") || true
          for t in $tags; do
            if gh release delete "$t" --cleanup-tag --yes; then
              echo "deleted the candidate $t"
            else
              echo "::warning::could not delete the candidate $t"
            fi
          done
          exit 0
