name: Release

on:
  push:
    # A release candidate's tag (vX.Y.Z-rc.<date>, D1192), or any tag preview.yml
    # accepts (vX.Y.Z-<suffix>), never runs a release, even when pushed by a token
    # that starts workflows: a stable tag has no hyphen, the update channel's rule.
    tags: ["v*", "!v*-*"]

permissions:
  contents: read

jobs:
  # Binaries + SBOMs + checksums attached to the release-please release, plus
  # the Homebrew cask generated (pushed to BeppeTemp/homebrew-tap by `cask`, after
  # `publish`). Windows has no package
  # manager channel: install.ps1 reads the release assets directly (D252). Every
  # asset carries a keyless build-provenance attestation (D1022).
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache: this job publishes what it builds (D1020).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # goreleaser's `sboms:` shells out to syft. Pinned by version and by the
      # sha256 of the archive, as mcp-publisher below (D1020); a bump is a
      # reviewed edit of both lines.
      - name: Install syft
        env:
          SYFT_VERSION: v1.55.0
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" syft
          install -m 0755 syft /usr/local/bin/syft
          rm "$archive" syft
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only rendered into the cask (the push is the `cask` job's).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # The release must still be a draft here (D1350): if GoReleaser had published
      # it or created a second release, fail before anything announces it. Drafts
      # are looked up through the releases listing, never by tag (that endpoint
      # does not return them).
      - name: Check the release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rel=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          if [ "$(printf '%s\n' "$rel" | grep -c .)" != 1 ] || [ "${rel#* }" != true ]; then
            echo "::error::$TAG must be exactly one draft release after GoReleaser (D1350), got: ${rel:-none}" >&2
            exit 1
          fi
      # sha256sums.txt lists every other published asset (binaries, Windows zips,
      # SBOMs) with its digest, so one attestation covers them all, and a second
      # covers the file itself (D1022). Names are not what verification matches:
      # `gh attestation verify <file>` looks the file's digest up.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/sha256sums.txt
      - name: Attest the checksum file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sha256sums.txt
      # The generated cask (skip_upload in .goreleaser.yaml) travels to the `cask`
      # job, which pushes it only after `publish`.
      - name: Keep the generated cask
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cask
          path: dist/homebrew/Casks/cartographer.rb
          # "Re-run all jobs" uploads it again: without this the second upload is a 409.
          overwrite: true
          if-no-files-found: error

  # The beta marker on the release itself (D82), which nothing was actually
  # setting: `"prerelease": true` in release-please-config.json does not put the
  # flag on the GitHub release, and had not since v0.2.0 — the only two releases
  # carrying it, v0.1.0 and v0.1.1, were marked by hand. See D211.
  #
  # This job owns the flag and then *verifies* it, so the mechanism cannot fail
  # silently a second time: an unset flag on a 0.x tag fails the release.
  # At 1.0.0 the condition stops matching on its own, and a stable tag is
  # asserted the other way round rather than left unchecked.
  prerelease-flag:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: write
    steps:
      - name: Mark a 0.x release as a pre-release, and verify it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v0.*) want=true ;;
            *)    want=false ;;
          esac
          # A draft can lose its tag name after GoReleaser (#1447): its name still says.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG or (.draft and .name == env.TAG)) | .id')
          if [ -z "$id" ] || [ "$(printf '%s\n' "$id" | wc -l)" != 1 ]; then
            echo "::error::no single release for $TAG" >&2
            exit 1
          fi
          # By id: the release is a draft (D1350) and the tag endpoint hides drafts.
          if [ "$want" = true ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f tag_name="$TAG" -F prerelease=true > /dev/null
          fi
          got=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .prerelease)
          if [ "$got" != "$want" ]; then
            echo "::error::$TAG is isPrerelease=$got, want $want (D82/D211)" >&2
            exit 1
          fi
          echo "$TAG: isPrerelease=$got"

  # The release-please release is created as a draft (D1350), so the update check
  # and every client skip it until this job: it runs only when the binaries and
  # the generated cask (goreleaser), the pre-release flag and the versioned image
  # (docker) all exist, and un-drafts the release. The cask on the tap and the
  # `:latest` image tag come after it (jobs `cask` and `latest`). A failed or retried job above leaves
  # the release a draft instead of announcing a version no channel can install.
  # Un-drafting keeps the pre-release flag; it is read back
  # because a 0.x release must stay a Pre-release (D82/D211).
  publish:
    runs-on: ubuntu-latest
    needs: [goreleaser, prerelease-flag, docker]
    permissions:
      contents: write
    steps:
      # The release notes are the CHANGELOG.md section of the tag, already grouped
      # by area: release-please's own notes file is ungrouped, and past the PR body
      # limit its placeholder has nothing to group (#1819). The next three steps run
      # the tag's own code (`go run`) and hold no secret and no credential (D1020);
      # only the last one holds GH_TOKEN, and runs `gh` only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go run ./internal/changelog/gen -file CHANGELOG.md -section "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          # GitHub rejects a release body over 125000 characters: fail here, the release stays a draft.
          n=$(wc -m < "$RUNNER_TEMP/release-notes.md")
          if [ "$n" -gt 125000 ]; then
            echo "::error::the notes of $TAG are $n characters, over GitHub's 125000 limit" >&2
            exit 1
          fi
      - name: Publish the release, and verify it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v0.*) want=true ;;
            *)    want=false ;;
          esac
          # A draft can lose its tag name after GoReleaser (#1447): its name still says.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG or (.draft and .name == env.TAG)) | .id')
          if [ -z "$id" ] || [ "$(printf '%s\n' "$id" | wc -l)" != 1 ]; then
            echo "::error::no single release for $TAG" >&2
            exit 1
          fi
          # By id: the tag endpoint does not return a draft. The body goes in the same
          # PATCH, so the release is never public with the ungrouped notes.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f tag_name="$TAG" -F draft=false -F body=@"$RUNNER_TEMP/release-notes.md" > /dev/null
          got=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '"\(.draft) \(.prerelease)"')
          if [ "$got" != "false $want" ]; then
            echo "::error::$TAG is isDraft/isPrerelease=$got, want false $want (D1350, D82)" >&2
            exit 1
          fi
          echo "$TAG: published (isDraft/isPrerelease=$got)"

  # Multi-arch server and Surveyor images on ghcr.io (D1440).
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/beppetemp/cartographer:${{ github.ref_name }}
      # The digest is the one buildx pushed (the image index), so the signature
      # holds for :<tag> and for :latest, which `latest` retags from it (D1022).
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/beppetemp/cartographer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The Surveyor image, second: a failure here leaves the release a draft
      # (D1350), nothing announced. Its own step id, so its attestation names its
      # own digest (release_publish_test.go pins it). FIRST PUBLISH: the new
      # package ghcr.io/beppetemp/cartographer-surveyor is private until set
      # Public in its settings, and "Manage Actions access" must list this
      # repository with Write, or the push is denied (D1440).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push-surveyor
        with:
          context: .
          target: surveyor
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/beppetemp/cartographer-surveyor:${{ github.ref_name }}
      - name: Attest the Surveyor image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/beppetemp/cartographer-surveyor
          subject-digest: ${{ steps.push-surveyor.outputs.digest }}
          push-to-registry: true

  # The Homebrew cask reaches the tap only once the release is public (D1350
  # amended): a cask pushed while the release is a draft names a URL that answers
  # 404. If this job fails the release stays public and the tap one version
  # behind: re-run it.
  cask:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cask
          path: cask
      - name: Push the cask to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/BeppeTemp/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp cask/cartographer.rb tap/Casks/cartographer.rb
          cd tap
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "the tap already has this cask"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cartographer.rb
          git commit -m "Brew cask update for cartographer version ${TAG}"
          git push

  # `:latest` moves only after the release is public (D1350 amended), and is
  # a retag of the pushed :<tag> index: same digest, so the provenance
  # attestation of D1022 holds for both.
  latest:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag :latest from the release images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create -t ghcr.io/beppetemp/cartographer:latest "ghcr.io/beppetemp/cartographer:${TAG}"
          docker buildx imagetools create -t ghcr.io/beppetemp/cartographer-surveyor:latest "ghcr.io/beppetemp/cartographer-surveyor:${TAG}"

  # Live read-only MCP demo on Cloud Run (D751). Skipped until the repository
  # variables exist; nothing waits on it, so a demo failure never blocks the
  # MCP Registry entry.
  demo:
    needs: docker
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/demo.yml
    with:
      tag: ${{ github.ref_name }}

  # Re-records the README hero when the release changed the Atlas (D790). It
  # builds from the tag's source, so it waits for nothing, and a failed recording
  # never blocks a release.
  hero:
    permissions:
      contents: write
    uses: ./.github/workflows/hero.yml
    with:
      tag: ${{ github.ref_name }}

  # Metadata entry in the official MCP Registry, pointing at the ghcr image
  # (ownership verified via the io.modelcontextprotocol.server.name LABEL). It
  # announces the version, so it waits for `publish` like the update check does
  # (D1350).
  mcp-registry:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by version and by the sha256 of the archive, never `releases/latest`
      # (D1020): this job runs the binary with `id-token: write`. A bump is a
      # reviewed edit of both lines; the digest is the one GitHub shows on the asset.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" mcp-publisher
          rm "$archive"
      - name: Set version in server.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" --arg img "ghcr.io/beppetemp/cartographer:${GITHUB_REF_NAME}" \
            '.version = $v | .packages[0].identifier = $img' server.json > server.tmp && mv server.tmp server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  # The candidates of this version leave with its release (D1192): every
  # pre-release vX.Y.Z-rc.<YYYYMMDD> of the version shipped is deleted, with its
  # tag; candidates of other versions stay. Never fails the release: a candidate
  # left behind is a warning, and the update channel skips it anyway. Deleting the
  # candidates is also what closes the freeze (scripts/freeze-open.sh, D1384): it is
  # open while a candidate newer than the latest stable release exists. After
  # `publish` on purpose: it un-drafts the release last, and the freeze must last
  # until the release is installable; a failed publish leaves the freeze open.
  candidate-cleanup:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Delete this version's release candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          version=$(printf '%s' "$TAG" | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p')
          if [ -z "$version" ]; then
            echo "::warning::$TAG is not vX.Y.Z: no candidate cleanup"
            exit 0
          fi
          pattern="^v${version//./\\.}-rc\\.[0-9]{8}$"
          tags=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' | grep -E "$pattern") || true
          for t in $tags; do
            if gh release delete "$t" --cleanup-tag --yes; then
              echo "deleted the candidate $t"
            else
              echo "::warning::could not delete the candidate $t"
            fi
          done
          exit 0
