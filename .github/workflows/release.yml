name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Binaries + checksums attached to the release-please release, plus the
  # Homebrew formula pushed to BeppeTemp/homebrew-tap. Windows has no package
  # manager channel: install.ps1 reads the release assets directly (D252).
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The beta marker on the release itself (D82), which nothing was actually
  # setting: `"prerelease": true` in release-please-config.json does not put the
  # flag on the GitHub release, and had not since v0.2.0 — the only two releases
  # carrying it, v0.1.0 and v0.1.1, were marked by hand. See D211.
  #
  # This job owns the flag and then *verifies* it, so the mechanism cannot fail
  # silently a second time: an unset flag on a 0.x tag fails the release.
  # At 1.0.0 the condition stops matching on its own, and a stable tag is
  # asserted the other way round rather than left unchecked.
  prerelease-flag:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Mark a 0.x release as a pre-release, and verify it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v0.*) want=true ;;
            *)    want=false ;;
          esac
          if [ "$want" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
          fi
          got=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          if [ "$got" != "$want" ]; then
            echo "::error::$TAG is isPrerelease=$got, want $want (D82/D211)" >&2
            exit 1
          fi
          echo "$TAG: isPrerelease=$got"

  # Multi-arch server image on ghcr.io.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/beppetemp/cartographer:${{ github.ref_name }}
            ghcr.io/beppetemp/cartographer:latest

  # Live read-only MCP demo on Cloud Run (D751). Skipped until the repository
  # variables exist; nothing waits on it, so a demo failure never blocks the
  # MCP Registry entry.
  demo:
    needs: docker
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/demo.yml
    with:
      tag: ${{ github.ref_name }}

  # Re-records the README hero when the release changed the Atlas (D790). It
  # builds from the tag's source, so it waits for nothing, and a failed recording
  # never blocks a release.
  hero:
    permissions:
      contents: write
    uses: ./.github/workflows/hero.yml
    with:
      tag: ${{ github.ref_name }}

  # Metadata entry in the official MCP Registry, pointing at the ghcr image
  # (ownership verified via the io.modelcontextprotocol.server.name LABEL).
  mcp-registry:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Set version in server.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" --arg img "ghcr.io/beppetemp/cartographer:${GITHUB_REF_NAME}" \
            '.version = $v | .packages[0].identifier = $img' server.json > server.tmp && mv server.tmp server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
