name: dependabot-arm

# The freeze (D1384) and Dependabot's auto-merge (D1180), one reconciling job that
# follows scripts/freeze-open.sh:
#   - freeze open (a release candidate newer than the latest stable release exists):
#     auto-merge is cancelled on the open Dependabot PRs, so none merges in it;
#   - freeze closed: auto-merge is armed on the open Dependabot PRs by the same rule
#     as dependabot-automerge.yml (scripts/dependabot-eligible.sh).
# It runs when a candidate is cut (preview completes), when the stable release ends
# (release completes) and after a discard (release-train completes). A run that
# failed is still `completed`: the freeze state, not the conclusion, decides.
# A failure is reported in the job summary and fails the job; nothing is swallowed.
on:
  workflow_run:
    workflows: [release, preview, release-train]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-arm
  cancel-in-progress: false

jobs:
  reconcile:
    permissions:
      contents: write # gh pr merge --auto / --disable-auto, and the releases listing of freeze-open.sh
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          failed=0
          if scripts/freeze-open.sh; then
            for n in $(gh pr list --state open --author 'app/dependabot' --json number,isCrossRepository,autoMergeRequest \
              --jq '.[] | select((.isCrossRepository | not) and .autoMergeRequest != null) | .number'); do
              if gh pr merge --disable-auto "$n"; then
                echo "- #$n: auto-merge disarmed" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- #$n: FAILED to disarm" >> "$GITHUB_STEP_SUMMARY"
                failed=1
              fi
            done
            exit "$failed"
          fi
          while read -r n branch; do
            # dependabot/<ecosystem>/<path>: the ecosystem is docker, go_modules, github_actions...
            eco=$(cut -d/ -f2 <<<"$branch")
            # The commit message carries `update-type:` for each updated dependency.
            types=$(gh pr view "$n" --json commits --jq '.commits[].messageBody' | sed -n 's/^ *update-type: *//p')
            if [ -z "$types" ] && [ "$eco" != docker ]; then
              echo "- #$n: FAILED, cannot read the update type from the commit" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            # shellcheck disable=SC2086 # one word per update type
            if ! scripts/dependabot-eligible.sh "$eco" $types; then
              echo "- #$n: left for a maintainer (major or docker bump)" >> "$GITHUB_STEP_SUMMARY"
            elif gh pr merge --auto --squash "$n"; then
              echo "- #$n: auto-merge armed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- #$n: FAILED to arm" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done < <(gh pr list --state open --author 'app/dependabot' --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"')
          exit "$failed"
