name: pr-title

# With squash-merge the PR title becomes the commit on main that release-please
# reads, and the PR body its message (D865). Its own workflow, not a job of
# ci.yml: it must re-run when a title or body is edited, and an `edited` trigger
# in ci.yml would re-run the whole suite on every `gh pr edit` and every body
# rewrite release-please does to its PR. The ruleset requires the job name
# `pr-title`, not a workflow.
#
# It also runs on `merge_group` (D1592): the merge queue waits for every required
# check on its own commit, and a check that never reports there blocks the queue.
# The title was linted when the PR was open and a queued PR cannot be edited, so
# on merge_group every other step is skipped and the job reports success.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Linted on the pull request
        if: github.event_name == 'merge_group'
        run: echo "the title and body passed on the pull request"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # release-please keeps only the first physical line of a conventional line
      # in the body, so a hard-wrapped one is cut mid-sentence in the changelog.
      # The body reaches the script through the environment, never interpolated.
      - name: Conventional lines in the body are one unwrapped line
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | go run ./internal/changelog/gen -check-body
      # internal/changelog.CanonicalScopes(); a test fails when they differ.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            atlas
            mcp
            lint
            client
            kb
            dev
            demo
            deploy
            ci
            docs
            deps
            main
          requireScope: false
