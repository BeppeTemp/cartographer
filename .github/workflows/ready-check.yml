name: ready-check

# The hosted pre-check of a maintainer's queued change (D1877). On the push
# of `ready/<slug>` (scripts/ready.sh: one commit on top of main or of the change it follows),
# each job first replays the change's queued chain (it and the queued changes it follows) on
# the current main (scripts/ready-check-base.sh: a chain that does not apply is red), then
# runs the legs `make check` does not: the Windows tests of the packages the chain can
# break, sharded as test-windows is (D785), and the frontend's unit tests and bundle checks
# when it touches web/. A replay that conflicts only in the committed bundle is not red: the jobs
# then test the sources without the bundle (`bundle=stale`, below), which the lander builds again.
# The lander reads this run's conclusion on the commit of a unit's tip
# (scripts/land.sh): a red unit is gated alone, so it no longer turns a whole train red and
# costs a bisection. The `readers` job runs the tests that read the repository or the combined
# tree (repodocs, docskb, boundaries, webui), the ones that break when main moves under a change.
# The browser suite and the rest of the Linux tests stay with the train gate.
#
# Only a maintainer can push a ready/ branch, so no pull request's code runs here; the jobs
# hold no secret and only read the repository. What to run is decided by
# scripts/ready-check-plan.sh, pinned by internal/repodocs/landertest/ready_check_test.go.
on:
  push:
    branches: ['ready/**']

permissions:
  contents: read

# A change queued again replaces its ready/ ref: the older run is moot.
concurrency:
  group: ready-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.plan.outputs.pkgs }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      web: ${{ steps.plan.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch: origin/main and the ready/ refs the queued chain is read from.
          fetch-depth: 0
          persist-credentials: false
      # Its own step, not a pipe into the plan: a chain that does not apply fails the job.
      - name: Replay the queued chain on main
        run: scripts/ready-check-base.sh > "$RUNNER_TEMP/paths"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - id: plan
        run: |
          scripts/ready-check-plan.sh < "$RUNNER_TEMP/paths" | tee -a "$GITHUB_OUTPUT"

  windows:
    name: windows (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.pkgs != ''
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        shell: bash
    steps:
      # As in ci.yml's test-windows legs: a throwaway runner, Defender only slows the
      # git-backed tests, and a runner whose Defender service is down must not fail the leg.
      - name: Disable Defender real-time scanning
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Replay the queued chain on main
        id: replay
        run: scripts/ready-check-base.sh > /dev/null
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      - env:
          PKGS: ${{ needs.plan.outputs.pkgs }}
          COUNT: ${{ needs.plan.outputs.count }}
          SHARD: ${{ matrix.shard }}
          # main's bundle on the change's sources: TestBundleMatchesSource skips (internal/webui).
          READY_CHECK_BUNDLE: ${{ steps.replay.outputs.bundle }}
        run: |
          # shellcheck disable=SC2086  # the packages are a word list on purpose
          ./scripts/test-shard.sh "$COUNT" "$SHARD" $PKGS

  web:
    name: web
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Replay the queued chain on main
        id: replay
        run: scripts/ready-check-base.sh > /dev/null
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --silent
      - if: steps.replay.outputs.bundle != 'stale'
        run: make web-check NPM_CI=
      # A stale bundle (main's, kept by the replay): the lander builds it again when it composes,
      # so web-check's provenance diff could only fail here; the build and its budget still run.
      - if: steps.replay.outputs.bundle == 'stale'
        run: make web NPM_CI= && cd web && npm run --silent budget
      - run: make web-test NPM_CI=

  # The tests that read the repository or the combined tree, on the replayed chain: they are the
  # ones a moved main reddens, and no other leg of the pre-check runs them.
  readers:
    name: readers
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Replay the queued chain on main
        id: replay
        run: scripts/ready-check-base.sh > /dev/null
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      - env:
          READY_CHECK_BUNDLE: ${{ steps.replay.outputs.bundle }}
        # The quarantine applies, as on every go test (test-shard.sh skips internal/repodocs).
        run: |
          re=$(scripts/quarantine.sh --skip)
          go test -count=1 ${re:+-skip "$re"} ./internal/repodocs/... ./internal/docskb ./internal/boundaries ./internal/webui

  # The verdict the lander reads: green when every leg that ran is green.
  ready-check:
    name: ready-check
    needs: [plan, windows, web, readers]
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "legs: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
