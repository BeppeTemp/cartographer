name: release-as

# The next release is named by its milestone (v<x.y.z>, the open one with the lowest
# version, D1384) but release-please computes the version from the commits: after a
# run of fix: commits it proposes x.y.(z+1) for a release named x.(y+1).0 (D1371). When the release PR is below the
# milestone, this opens one PR with an empty commit whose squash body is
# `Release-As: <version>` and arms auto-merge; a higher version is only
# reported, a version is never lowered. The decision is scripts/release-as.sh.
#
# workflow_run runs the workflow from the default branch, after the whole
# release-please workflow (its release-pr job included) has finished. No
# milestone trigger: it would race the title update after a Release-As merge.
on:
  workflow_run:
    workflows: [release-please]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-as
  cancel-in-progress: false

jobs:
  release-as:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PLEASE_TOKEN is a PAT and it is needed three times (push, PR
      # creation, auto-merge): with github.token the PR starts no pull_request
      # workflow, so its required checks never report, and a merge by
      # github.token starts no push workflow, so release-please would never
      # rewrite the release PR. Nothing from a PR is checked out or run.
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Same selection as release-please.yml: this repository's release-please-- branch.
          # Captured first: a failing gh fails the step; only an empty result means "none".
          found=$(gh pr list --state open --search "head:release-please--" --json number,title,isCrossRepository \
            -q '[.[] | select(.isCrossRepository | not)][0] | select(. != null) | "\(.number) \(.title)"')
          if [ -z "$found" ]; then
            echo "no release PR open" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          number=${found%% *}
          title=${found#* }
          # The lowest version, numerically (not lexically); no due date is read.
          milestone=$(gh api "repos/$GH_REPO/milestones?state=open&per_page=100" \
            --jq '[.[] | select(.title | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .title] | sort_by(split(".")|map(ltrimstr("v")|tonumber))[0] // empty')
          if [ -z "$milestone" ]; then
            echo "release PR #$number: no open milestone named v<x.y.z>" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "number=$number"
            echo "milestone=$milestone"
            printf 'title<<EOF_TITLE\n%s\nEOF_TITLE\n' "$title"
          } >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - if: steps.pr.outputs.number != ''
        id: verdict
        env:
          TITLE: ${{ steps.pr.outputs.title }}
          MILESTONE: ${{ steps.pr.outputs.milestone }}
        run: |
          verdict=$(scripts/release-as.sh "$TITLE" "$MILESTONE")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "release PR '$TITLE' vs milestone $MILESTONE: $verdict" >> "$GITHUB_STEP_SUMMARY"
      # Reported once per pair of versions, never acted on.
      - if: startsWith(steps.verdict.outputs.verdict, 'higher ')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          marker="<!-- release-as: $VERDICT -->"
          if gh pr view "$PR" --json comments -q '.comments[].body' | grep -qF "$marker"; then exit 0; fi
          gh pr comment "$PR" --body "$marker
          The release PR proposes a higher version than the next release's milestone ($VERDICT: PR version, then milestone). Nothing is changed; align the milestone if this is intended."
      - if: startsWith(steps.verdict.outputs.verdict, 'act ')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          version=${VERDICT#act }
          subject="chore(ci): align the next release with the milestone v$version"
          branch=release-as/next-train
          existing=$(gh pr list --state open --head "$branch" --json number,title,isCrossRepository \
            -q '[.[] | select(.isCrossRepository | not)][0] | select(. != null) | "\(.number)\t\(.title)"')
          if [ -n "$existing" ]; then
            n=${existing%%$'\t'*}
            if [ "${existing#*$'\t'}" = "$subject" ]; then
              echo "release PR guard #$n already open for v$version" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh pr close "$n" --comment "The next release's milestone changed: superseded by a guard for v$version."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" origin/main
          git commit --allow-empty -m "$subject" -m "Release-As: $version"
          # The branch belongs to this workflow: a leftover with no PR is overwritten.
          git remote set-url origin "https://x-access-token:${RELEASE_PLEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "$subject" \
            --body "Empty commit that makes release-please propose v$version, the next release's milestone.")
          gh pr merge "$url" --auto --squash --subject "$subject" --body "Release-As: $version"
          echo "opened $url for v$version" >> "$GITHUB_STEP_SUMMARY"
