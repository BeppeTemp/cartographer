name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PLEASE_TOKEN is a PAT: PRs opened with the default
      # GITHUB_TOKEN do not trigger pull_request workflows, and the release
      # PR would stay blocked without the required "test" check.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # The decision index is regenerated here, not in feature PRs (D328): each
  # PR adds only its docs/decisions/D<n>-*.md file, and the release PR — the
  # one full pass before a tag, where CI checks the index strictly — carries
  # the regenerated docs/decisions.md. release-please rewrites its branch on
  # every push to main, so this runs after it every time.
  decisions-index:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - id: branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          b=$(gh pr list -R "${{ github.repository }}" --state open --search "head:release-please--" --json headRefName -q '.[0].headRefName')
          echo "name=$b" >> "$GITHUB_OUTPUT"
      - if: steps.branch.outputs.name != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - if: steps.branch.outputs.name != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: steps.branch.outputs.name != ''
        run: |
          make decisions-index
          if git diff --quiet docs/decisions.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate the decision index" docs/decisions.md
          git push
