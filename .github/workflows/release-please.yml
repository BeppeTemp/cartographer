name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PLEASE_TOKEN is a PAT: PRs opened with the default
      # GITHUB_TOKEN do not trigger pull_request workflows, and the release
      # PR would stay blocked without the required "test" check.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # release-please rewrites its branch and its PR body on every push to main, so
  # this runs after it every time, and every step is idempotent.
  # - The decision index is regenerated here, not in feature PRs (D328): each PR
  #   adds only its docs/decisions/D<n>-*.md file, and the release PR — the one
  #   full pass before a tag, where CI checks the index strictly — carries the
  #   regenerated docs/decisions.md.
  # - The changelog is grouped by area here (D865), in CHANGELOG.md and in the
  #   PR body: release-please builds the GitHub release from the merged body.
  release-pr:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - id: branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          b=$(gh pr list -R "${{ github.repository }}" --state open --search "head:release-please--" --json headRefName -q '.[0].headRefName')
          echo "name=$b" >> "$GITHUB_OUTPUT"
      - if: steps.branch.outputs.name != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - if: steps.branch.outputs.name != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: steps.branch.outputs.name != ''
        run: |
          make decisions-index changelog-areas
          if git diff --quiet docs/decisions.md CHANGELOG.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate the decision index and group the changelog by area" docs/decisions.md CHANGELOG.md
          git push
      # Edited only when the grouping changes it: an edit re-runs pr-title.
      - if: steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          gh pr view -R "${{ github.repository }}" "$BRANCH" --json body -q .body > "$RUNNER_TEMP/body.md"
          go run ./internal/changelog/gen -stdin < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/grouped.md"
          if cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/grouped.md"; then exit 0; fi
          gh pr edit -R "${{ github.repository }}" "$BRANCH" --body-file "$RUNNER_TEMP/grouped.md"
