name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# The release-pr job reads the PR body, groups it and writes it back: two runs
# close together would race between the read and the write, and the grouped body
# of the earlier one would then lack the later run's entries (Regroup leaves a
# grouped body alone). One run at a time; a waiting one is replaced by the newest.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # RELEASE_PLEASE_TOKEN is a PAT: PRs opened with the default
      # GITHUB_TOKEN do not trigger pull_request workflows, and the release
      # PR would stay blocked without the required "test" check.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # release-please rewrites its branch and its PR body on every push to main, so
  # this runs after it every time, and every step is idempotent.
  # - The decision index is regenerated here, not in feature PRs (D328): each PR
  #   adds only its docs/decisions/D<n>-*.md file, and the release PR — the one
  #   full pass before a tag, where CI checks the index strictly — carries the
  #   regenerated docs/decisions.md.
  # - The changelog is grouped by area here (D865), in CHANGELOG.md and in the
  #   PR body: release-please builds the GitHub release from the merged body.
  release-pr:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        # Only a branch of this repository: a fork PR whose branch starts with
        # release-please-- also matches the search, and checking out its name
        # here would fail and skip the steps below.
        run: |
          b=$(gh pr list -R "${{ github.repository }}" --state open --search "head:release-please--" --json headRefName,isCrossRepository -q '[.[] | select(.isCrossRepository | not)][0].headRefName // empty')
          echo "name=$b" >> "$GITHUB_OUTPUT"
      # No credential stays in the checkout: the next steps run the branch's own
      # code (`make`, `go run`). The push step sets the PAT on `origin` itself,
      # last (D1020).
      - if: steps.branch.outputs.name != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.name }}
          persist-credentials: false
      - if: steps.branch.outputs.name != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.branch.outputs.name != ''
        id: regen
        run: |
          make decisions-index changelog-areas
          if git diff --quiet docs/decisions.md CHANGELOG.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate the decision index and group the changelog by area" docs/decisions.md CHANGELOG.md
          echo "committed=true" >> "$GITHUB_OUTPUT"
      - if: steps.regen.outputs.committed == 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${RELEASE_PLEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push
      # Edited only when the grouping changes it: an edit re-runs pr-title.
      - if: steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          gh pr view -R "${{ github.repository }}" "$BRANCH" --json body -q .body > "$RUNNER_TEMP/body.md"
          go run ./internal/changelog/gen -stdin < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/grouped.md"
          if cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/grouped.md"; then exit 0; fi
          gh pr edit -R "${{ github.repository }}" "$BRANCH" --body-file "$RUNNER_TEMP/grouped.md"
