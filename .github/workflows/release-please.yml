name: release-please

# A maintenance branch `release-<x.y>` cut from a tag gets its own release PR,
# `release-please--branches--release-<x.y>`, against that branch (D1443): the
# workflow runs from the pushed branch's copy, so the branch must carry this file.
on:
  push:
    branches: [main, "release-[0-9]+.[0-9]+"]

permissions:
  contents: read

# The release-pr job reads the PR body, groups it and writes it back: two runs
# close together would race between the read and the write, and the grouped body
# of the earlier one would then lack the later run's entries (Regroup leaves a
# grouped body alone). One run at a time; a waiting one is replaced by the newest.
concurrency:
  group: release-please-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # RELEASE_PLEASE_TOKEN is a PAT: PRs opened with the default
      # GITHUB_TOKEN do not trigger pull_request workflows, and the release
      # PR would stay blocked without the required "test" check.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: ${{ github.ref_name }}

  # release-please rewrites its branch and its PR body on every push to main, so
  # this runs after it every time, and every step is idempotent.
  # - The decision index is regenerated here, not in feature PRs (D328): each PR
  #   adds only its docs/decisions/D<n>-*.md file, and the release PR — the one
  #   full pass before a tag, where CI checks the index strictly — carries the
  #   regenerated docs/decisions.md.
  # - The changelog is grouped by area here (D865), in CHANGELOG.md and in the
  #   PR: the body holds the start of the grouped notes and comments the rest
  #   (GitHub's limit is 65536 characters; release-please replaces a body over it
  #   with a link). The notes come from CHANGELOG.md, whatever release-please did
  #   to its body; release.yml publishes the same section.
  release-pr:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TARGET: ${{ github.ref_name }}
        # Only a branch of this repository: a fork PR whose branch starts with
        # release-please-- also matches the search, and checking out its name
        # here would fail and skip the steps below. The release PR of the pushed
        # branch only: main and a maintenance branch may both have one open.
        run: |
          b=$(gh pr list -R "${{ github.repository }}" --state open --search "head:release-please--branches--$TARGET" --json headRefName,isCrossRepository -q '[.[] | select(.isCrossRepository | not)][0].headRefName // empty')
          echo "name=$b" >> "$GITHUB_OUTPUT"
      # No credential stays in the checkout: the next steps run the branch's own
      # code (`make`, `go run`). The push step sets the PAT on `origin` itself,
      # after them, and takes it off again (D1020).
      - if: steps.branch.outputs.name != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.name }}
          persist-credentials: false
      - if: steps.branch.outputs.name != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache: this job also runs on maintenance branches and pushes (D1020).
          cache: false
      - if: steps.branch.outputs.name != ''
        id: regen
        run: |
          make decisions-index changelog-areas
          if git diff --quiet docs/decisions.md CHANGELOG.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate the decision index and group the changelog by area" docs/decisions.md CHANGELOG.md
          echo "committed=true" >> "$GITHUB_OUTPUT"
      # Limit: a step that runs the branch's code can still write $GITHUB_ENV or $GITHUB_PATH for
      # the steps after it, so the later steps that hold the PAT are only as sound as the branch is.
      # The notes are cut here, before the token is used: the step that runs the
      # branch's own code (`go run`) holds no secret. The version is the one the
      # release PR carries; the notes are the CHANGELOG.md section release.yml
      # publishes, not the PR body, which release-please replaces with a link when
      # the notes pass GitHub's limit (#2131).
      - if: steps.branch.outputs.name != ''
        run: |
          set -euo pipefail
          v=$(jq -r '.["."]' .release-please-manifest.json)
          go run ./internal/changelog/gen -file CHANGELOG.md -section "$v" -split 60000 -out "$RUNNER_TEMP/notes"
      # The token goes on `origin` for the push only, and comes off it again.
      - if: steps.regen.outputs.committed == 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          git remote set-url origin "https://x-access-token:${RELEASE_PLEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push
      # The body is part 1 in release-please's frame (it parses the body on merge:
      # notes between the first and last `---` line) and each later part is a comment of the token's own user,
      # marked `<!-- release-notes-part:N -->`: edited in place, created when
      # missing, deleted past the last part. Written only when the text changes: a
      # body edit re-runs pr-title. Runs `gh` only.
      - if: steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          notes="$RUNNER_TEMP/notes"
          parts=("$notes"/part-*.md)
          n=${#parts[@]}
          pr=$(gh pr view -R "$repo" "$BRANCH" --json number -q .number)
          # GitHub may store the text with CRLF: compare without it ($(...) drops the final newlines).
          norm() { tr -d '\r'; }
          if [ "$(gh pr view -R "$repo" "$BRANCH" --json body -q .body | norm)" != "$(norm < "$notes/body.md")" ]; then
            gh pr edit -R "$repo" "$BRANCH" --body-file "$notes/body.md"
          fi
          me=$(gh api user -q .login)
          gh api --paginate "repos/$repo/issues/$pr/comments" \
            --jq ".[] | select(.user.login == \"$me\") | select(.body | test(\"^<!-- release-notes-part:[0-9]+ -->\")) | {id, part: (.body | capture(\"^<!-- release-notes-part:(?<n>[0-9]+) -->\").n | tonumber), body}" > "$RUNNER_TEMP/comments.jsonl"
          for ((i = 2; i <= n; i++)); do
            id=$(jq -r --argjson i "$i" 'select(.part == $i) | .id' "$RUNNER_TEMP/comments.jsonl" | head -n 1)
            if [ -z "$id" ]; then
              gh api -X POST "repos/$repo/issues/$pr/comments" -F body="@$notes/part-$i.md" > /dev/null
              continue
            fi
            cur=$(jq -r --argjson id "$id" 'select(.id == $id) | .body' "$RUNNER_TEMP/comments.jsonl" | norm)
            if [ "$cur" != "$(norm < "$notes/part-$i.md")" ]; then
              gh api -X PATCH "repos/$repo/issues/comments/$id" -F body="@$notes/part-$i.md" > /dev/null
            fi
          done
          # Parts past the last one, and a second comment of one part, go.
          jq -r --argjson n "$n" --slurp '[.[] | select(.part > $n)] + (group_by(.part) | map(.[1:][]) ) | map(.id) | unique | .[]' "$RUNNER_TEMP/comments.jsonl" | while read -r id; do
            gh api -X DELETE "repos/$repo/issues/comments/$id" > /dev/null
          done
