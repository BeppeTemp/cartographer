# Deploys the live MCP demo (D751, D800) to Cloud Run: called by the release
# workflow after the server image is published, or run by hand to redeploy a
# given tag without a release. Authenticates by Workload Identity Federation: no
# key anywhere. Skipped until the repository variables exist (deploy/demo/README.md).
name: demo

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose server image the demo is built on
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose server image the demo is built on (e.g. v0.24.0)
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.GCP_WIF_PROVIDER != ''
    env:
      TAG: ${{ inputs.tag }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/demo/cartographer-demo:${{ inputs.tag }}
      HOSTNAME: cartographer-demo.beppetemp.com
    steps:
      - uses: actions/checkout@v7
        with:
          # The KB and the replay script of the tag being deployed.
          ref: ${{ inputs.tag }}
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v4
      # The replayed history ends "yesterday" relative to the build, which is why
      # the image is rebuilt on every release. amd64 only: Cloud Run's.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/demo/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE=ghcr.io/beppetemp/cartographer:${{ inputs.tag }}
          tags: ${{ env.IMAGE }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy
        run: |
          gcloud run deploy cartographer-demo \
            --project "${{ vars.GCP_PROJECT }}" --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE" --quiet
      - name: Probe the public hostname
        run: |
          # /health is public and carries ready; /ready needs the token.
          for _ in $(seq 20); do
            if curl -sf "https://$HOSTNAME/health" | grep -q '"ready":true'; then
              echo "demo is up on $HOSTNAME"
              exit 0
            fi
            sleep 3
          done
          echo "::error::https://$HOSTNAME/health never reported ready:true" >&2
          exit 1
      - name: Connect without a token
        run: |
          # The Worker sets the read-only token (D789): a client that sends none
          # must still initialize, or a phone connector cannot reach the demo.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$HOSTNAME/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"demo-probe","version":"0"}}}')
          [ "$code" = 200 ] || { echo "::error::initialize without a token on $HOSTNAME: want 200, got $code" >&2; exit 1; }
      - name: Check the guestbook is mounted
        run: |
          # A warning, not a failure (D800): an expired git token or a closed
          # remote leaves the astronomy demo up, and a release must not fail
          # because a secret expired. With the guestbook mounted every tool takes
          # a required `kb` that lists it; with astronomy alone no tool does.
          tools=$(curl -s -X POST "https://$HOSTNAME/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          case $tools in
            *'"guestbook"'*) echo "guestbook is mounted on $HOSTNAME" ;;
            *) echo "::warning::tools/list on $HOSTNAME does not list the guestbook: the demo serves astronomy alone (check the guestbook git token and remote, deploy/demo/README.md)" ;;
          esac
