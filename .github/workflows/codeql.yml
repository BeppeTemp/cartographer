# CodeQL for Go, JavaScript/TypeScript and the workflows (D1020). Not a required
# check. It is a workflow of its own because it runs on a PR that touches code,
# while security.yml scans a PR only when the dependency graph changes.
#
# This replaces GitHub's "default setup": keep the default setup disabled in
# Settings -> Code security, or the two upload the same analysis twice.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - web/src/**
      - .github/workflows/**
      - .github/codeql/**
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fork PRs get a read-only token: they cannot upload SARIF, so they skip this
  # job; the push to main and the weekly run still analyse the merged code.
  codeql:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
