name: release-train

# The release on demand (D1384, superseding the weekly calendar of D956 and D1192).
# Run by hand with one action:
#   rc       builds the release candidate (image and pre-release binaries, preview.yml);
#            from then on the freeze is open (scripts/freeze-open.sh);
#            skipped while a change is parked (wip/*), or while an accepted bug found by a
#            candidate or a nightly is open or a fix is rejected (failed/fix-*) and the
#            release PR has no `next-rc-ok` label (removed once a candidate is dispatched);
#   release  merges the release PR if a maintainer ran the candidate and added the
#            `rc-ok` label, with every check below;
#   discard  deletes the candidate(s) of the pending version, which closes the freeze.
# Freeze: while a candidate newer than the latest stable release exists, nothing that
# adds or breaks behaviour lands (CONTRIBUTING.md §Releases).
#
# TRAPS (pinned by internal/repodocs/release_train_test.go):
#   - A merge made with the default GITHUB_TOKEN does not trigger the `push`
#     workflows, so release-please would never cut the tag: the merge step uses the
#     RELEASE_PLEASE_TOKEN PAT, as release-please.yml does.
#   - github.token cannot read Dependabot alerts or repository security advisories,
#     and the temporary private fork of an advisory is another repository: the
#     security gate reads them with SECURITY_GATE_TOKEN, a fine-grained read-only PAT
#     on all of the owner's repositories (Dependabot alerts, Code scanning alerts,
#     Repository security advisories, Pull requests). The merge waits for its
#     `clear` output, so a gate that never ran never merges.
#   - The `train` job, which holds the PAT, has no `uses:` on purpose: it checks out
#     nothing and runs only `gh`, so no third-party code runs with the PAT. The
#     checkout that scripts/freeze-open.sh needs lives in the `freeze` and `discard`
#     jobs, which never see the PAT (a SHA-pinned actions/checkout, no credentials
#     kept). Keep it that way.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "rc builds the release candidate, release merges the release PR with all its checks, discard deletes the candidate(s) of the pending version"
        type: choice
        options: [rc, release, discard]
        required: true

permissions: {}

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  # The oldest candidate of the pending version, for the freeze check of the release
  # gate. A job of its own because it needs a checkout (see TRAPS).
  freeze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Closed (exit 1) prints nothing: no candidate. An unreadable listing (exit 3)
          # counts as open and prints nothing either, and the release gate then skips.
          tag=$(scripts/freeze-open.sh --candidate || true)
          echo "candidate: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Split from the `train` job because it needs a checkout and `contents: write`,
  # and the PAT job must run no `uses:` (see TRAPS). Uses github.token only.
  discard:
    if: inputs.action == 'discard'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release delete --cleanup-tag
      pull-requests: write # the rc-ok label and the comment on the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Delete the candidates of the pending version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Exit 1 = closed, nothing to discard; exit 3 = the listing cannot be read,
          # which is not "nothing to discard": fail.
          rc=0
          tags=$(scripts/freeze-open.sh --candidates) || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::error::cannot list the releases: the candidates were not discarded" >&2
            exit 1
          fi
          if [ -z "$tags" ]; then
            echo "no release candidate newer than the latest release: nothing to discard"
            exit 0
          fi
          for tag in $tags; do
            gh release delete "$tag" --cleanup-tag --yes
            echo "discarded $tag"
          done
          n=$(gh pr list --state open --label "autorelease: pending" \
            --head release-please--branches--main --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          if [ -n "$n" ]; then
            gh pr edit "$n" --remove-label rc-ok || true
            gh pr comment "$n" --body "Release candidate discarded: $(printf '%s' "$tags" | paste -sd, -). The freeze is closed; \`rc-ok\` is removed. Run \`release-train\` with \`action: rc\` for a new candidate."
          fi

  train:
    if: inputs.action != 'discard'
    needs: freeze
    permissions:
      contents: read
      pull-requests: write # comments on the release PR
      actions: write # dispatching preview.yml
      checks: read # gh pr checks reads the check runs
      statuses: read # and the commit statuses
    runs-on: ubuntu-latest
    steps:
      - name: What does this run do
        id: mode
        env:
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          echo "mode: $INPUT_ACTION"
          echo "mode=$INPUT_ACTION" >> "$GITHUB_OUTPUT"

      - name: Find the release PR
        id: pr
        if: steps.mode.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --head matches only the branch name: a fork can open a PR from a branch of
          # the same name, so the PR must come from this repository.
          n=$(gh pr list --state open --label "autorelease: pending" \
            --head release-please--branches--main --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          if [ -z "$n" ]; then
            echo "no release PR open: nothing to do"
          else
            echo "release PR: #$n"
            echo "number=$n" >> "$GITHUB_OUTPUT"
          fi


      # A change parked on origin (scripts/unlanded.sh) is finished work no candidate would contain:
      # the candidate waits until the maintainer lands it or moves it out. A skip, not a failure.
      - name: Refuse a candidate while a change is parked
        id: wip
        if: steps.mode.outputs.mode == 'rc' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # An unreadable listing is not "none parked": fail rather than cut a candidate without it.
          parked=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/heads/wip/" --jq '.[].ref | ltrimstr("refs/heads/")')
          if [ -n "$parked" ]; then
            list=$(printf '%s\n' "$parked" | tr -d '`@' | sed 's/.*/`&`/' | paste -sd, - | sed 's/,/, /g')
            echo "release candidate skipped: parked branches: $parked"
            gh pr comment "$PR" --body "Release candidate skipped: a change is parked on origin ($list) and no candidate would contain it. Land it (\`make ready\`) or delete the branch, then run \`release-train\` with \`action: rc\`."
            echo "parked=yes" >> "$GITHUB_OUTPUT"
          fi

      # A defect a candidate's trial or a nightly run found and nobody fixed yet, or a fix the lander
      # rejected, would be in the next candidate too: the candidate waits for the fix, unless a
      # maintainer set `next-rc-ok` on the release PR. A skip, not a failure. The `found_by` and
      # `trusted` lines are the ones of scripts/issue-queue.sh (release_train_test.go pins it).
      - name: Refuse a candidate while a bug found by a candidate or a nightly is open
        id: blockers
        if: steps.mode.outputs.mode == 'rc' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # An unreadable listing is not "none open": fail rather than cut a candidate without the fix.
          waived=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | index("next-rc-ok") != null')
          bugs=$(gh api --paginate "repos/$GH_REPO/issues?state=open&labels=bug,accepted&per_page=100" --jq '
            def found_by: [(.body // "") | split("\n")[] | rtrimstr("\r") | select(test("^Found-by: [a-z-]+$")) | ltrimstr("Found-by: ")];
            def trusted: .user.login == "github-actions[bot]" or (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"));
            .[] | select(.pull_request | not) | select(trusted and (found_by | index("rc") or index("nightly"))) | "#\(.number)"')
          failed=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/heads/failed/fix-" --jq '.[].ref | ltrimstr("refs/heads/")')
          # A ref name is anyone's text with push access: no backtick or @ reaches the log or the comment.
          failed=$(printf '%s' "$failed" | tr -d '`@')
          if [ "$waived" = true ]; then
            echo "next-rc-ok is set: not blocked by: $bugs $failed"
          elif [ -n "$bugs$failed" ]; then
            refs=$(printf '%s' "$failed" | sed 's/.*/`&`/')
            list=$(printf '%s\n%s\n' "$bugs" "$refs" | grep -v '^$' | paste -sd, - | sed 's/,/, /g')
            echo "release candidate skipped: open blockers: $bugs $failed"
            gh pr comment "$PR" --body "Release candidate skipped: a bug found by a candidate or a nightly run is open, or a fix was rejected ($list), and the candidate would carry the defect. Land the fix, or add the \`next-rc-ok\` label to this PR, then run \`release-train\` with \`action: rc\`."
            echo "blocked=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch the release candidate build
        if: steps.mode.outputs.mode == 'rc' && steps.pr.outputs.number != '' && steps.wip.outputs.parked != 'yes' && steps.blockers.outputs.blocked != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          title=$(gh pr view "$PR" --json title --jq .title)
          version=$(printf '%s' "$title" | sed -n 's/^chore([a-z]*): release \([0-9][0-9.]*[0-9]\).*/\1/p')
          if [ -z "$version" ]; then
            echo "::error::cannot read the version from the release PR title '$title'" >&2
            exit 1
          fi
          # One tag per candidate: vX.Y.Z-rc.<YYYYMMDD>.<n>, <n> one more than the highest of
          # today's runs of preview.yml, whatever their conclusion. A build that failed made
          # no tag and no release: its run title (the tag, preview.yml's run-name) is the
          # only record of it, so a read of the runs that fails stops here, dispatching
          # nothing, rather than reuse a number. Must match the pre-release rule of
          # preview.yml (vX.Y.Z-<suffix>).
          today=$(date -u +%Y%m%d)
          if ! runs=$(gh run list --workflow preview.yml --limit 50 --json displayTitle --jq '.[].displayTitle'); then
            echo "::error::cannot read the runs of preview.yml (gh run list): no candidate dispatched, so that no tag is reused" >&2
            exit 1
          fi
          last=$(printf '%s\n' "$runs" | grep -E -- "-rc\.${today}\.[0-9]+$" | grep -F -- "v${version}-rc." | sed 's/.*\.//' | sort -n | tail -n 1 || true)
          tag="v${version}-rc.${today}.$(( 10#${last:-0} + 1 ))"
          gh workflow run preview.yml -f tag="$tag"
          # `next-rc-ok` waives the blockers of one candidate, this one: the next asks again.
          gh pr edit "$PR" --remove-label next-rc-ok || true
          # One comment for every candidate of the PR, edited in place: the marker finds it,
          # the tags of the earlier candidates are read back from its own lines.
          cur=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- release-candidate -->")) | {id, body}' | head -n 1)
          id=""
          earlier=""
          if [ -n "$cur" ]; then
            id=$(printf '%s' "$cur" | jq -r '.id')
            prev=$(printf '%s' "$cur" | jq -r '.body')
            last=$(printf '%s\n' "$prev" | sed -n 's/^Latest: `\([^`]*\)`.*/\1/p')
            list=$(printf '%s\n' "$prev" | sed -n 's/^Earlier: //p' | grep -o '`[^`]*`' | tr -d '`' || true)
            earlier=$(printf '%s\n%s\n' "$last" "$list" | grep -v -x -e '' -e "$tag" | awk '!s[$0]++' | sed 's/.*/`&`/' | paste -sd, - | sed 's/,/, /g')
          fi
          body="<!-- release-candidate -->"$'\n'"Latest: \`$tag\` is building (preview.yml): images \`ghcr.io/beppetemp/cartographer:$tag\` (server) and \`ghcr.io/beppetemp/cartographer-surveyor:$tag\` (Surveyor) on a deployment, pre-release binaries https://github.com/$GH_REPO/releases/tag/$tag for a native service and client (\`CARTOGRAPHER_INSTALL_TAG=$tag\`). The freeze is open until the release or a \`discard\`. Try it, then add the \`rc-ok\` label and run \`release-train\` with \`action: release\`: it merges this PR only with the label."
          if [ -n "$earlier" ]; then
            body="$body"$'\n'"Earlier: $earlier"
          fi
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

      # Every condition below is a reason to skip the release, never to fail it.
      - name: Check the release may leave
        id: gate
        if: steps.mode.outputs.mode == 'release' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          CANDIDATE: ${{ needs.freeze.outputs.candidate }}
        run: |
          skip() { # skip <comment body>: say why on the PR and leave without merging
            echo "release skipped: $1"
            gh pr comment "$PR" --body "Release skipped: $1"
            exit 0
          }

          labelled=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | index("rc-ok") != null')
          [ "$labelled" = true ] || skip "no \`rc-ok\` label. Run the release candidate, add the label, then run \`release-train\` with \`action: release\`."

          # The release must not ship a commit the candidate did not contain: the newest
          # successful candidate build must be of the head of main, and the label must
          # come after that build. A label newer than the last commit is not enough: a
          # fix merged after the candidate build and before the label was never run.
          retry="Run \`release-train\` by hand with \`action: rc\`, try the new candidate, then remove and add \`rc-ok\` again."
          head_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          # Only a release candidate counts, not any preview of main: run-name carries the tag.
          # No --status: it filters on a run's first attempt, so a candidate that succeeded on a re-run is missing (#2355).
          read -r rc_sha rc_at < <(gh run list --workflow preview.yml --branch main --limit 20 \
            --json conclusion,headSha,updatedAt,displayTitle \
            --jq '[.[] | select(.conclusion == "success" and (.displayTitle | test("-rc\\.[0-9]{8}(\\.[0-9]+)?$")))][0] | "\(.headSha) \(.updatedAt)"') || true
          if [ -z "${rc_sha:-}" ] || [ "$rc_sha" != "$head_sha" ]; then
            # Name the cause: a candidate whose build or smoke failed (D995) also
            # leaves no successful run, and "not the head of main" hid it.
            failed_url=$(gh run list --workflow preview.yml --branch main --limit 20 \
              --json conclusion,displayTitle,url \
              --jq '[.[] | select(.displayTitle | test("-rc\\.[0-9]{8}(\\.[0-9]+)?$"))][0] | select(.conclusion == "failure") | .url') || true
            if [ -n "${failed_url:-}" ]; then
              skip "the last release candidate build (or the README film) failed (${failed_url}). Fix it, run \`release-train\` by hand with \`action: rc\`, try the new candidate, then remove and add \`rc-ok\` again."
            fi
            skip "the last candidate built (${rc_sha:-none}) is not the head of \`main\` (${head_sha:0:8}). $retry"
          fi
          read -r ok_at ok_by < <(gh api --paginate "repos/$GH_REPO/issues/$PR/timeline" \
            --jq '.[] | select(.event == "labeled" and .label.name == "rc-ok") | "\(.created_at) \(.actor.login)"' | sort | tail -1) || true
          [ -n "${ok_at:-}" ] && [ "$ok_at" \> "$rc_at" ] \
            || skip "\`rc-ok\` (added ${ok_at:-never}) predates the build of the current candidate ($rc_at). $retry"
          # Triage can add a label; only a maintainer (write or more) vouches for a candidate.
          perm=$(gh api "repos/$GH_REPO/collaborators/$ok_by/permission" --jq .permission || true)
          case "$perm" in admin | maintain | write) ;; *) skip "\`rc-ok\` was added by $ok_by, who is not a maintainer. $retry" ;; esac

          # Freeze: any feat, perf, refactor or breaking commit on main since the oldest
          # candidate of the pending version, the one that opened the freeze. Not the
          # newest: the check above already makes the newest successful candidate the
          # head of main, so "since the newest" would always be empty and a feat that
          # slipped in and was re-cut into a new candidate would not block.
          [ -n "$CANDIDATE" ] || skip "no release candidate newer than the latest release. Run \`release-train\` by hand with \`action: rc\`."
          cand_sha=$(gh api "repos/$GH_REPO/commits/$CANDIDATE" --jq .sha) || skip "cannot read the commit of the candidate \`$CANDIDATE\`."
          blocked=$(gh api --paginate "repos/$GH_REPO/compare/$cand_sha...main?per_page=100" \
            --jq '.commits[] | select(.commit.message | test("\\A(feat|perf|refactor)(\\([^)]*\\))?!?:|\\A[a-z]+(\\([^)]*\\))?!:|\\nBREAKING[ -]CHANGE")) | "- \(.sha[0:8]) \(.commit.message | split("\n")[0])"')
          [ -z "$blocked" ] || skip "commits blocked by the freeze landed on \`main\` since the candidate \`$CANDIDATE\`:"$'\n'"$blocked"

          # A skipped required check reports as passed (docs/deployment.md), so skipping counts.
          checks=$(gh pr checks "$PR" --required --json bucket --jq '[.[].bucket]' || true)
          [ -n "$checks" ] && [ "$(echo "$checks" | jq 'length > 0 and all(. == "pass" or . == "skipping")')" = true ] \
            || skip "the required checks of this PR have not all passed."

          # Pin the head that was checked: release-please may push to the branch before the merge.
          sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # No release with a known hole (D1123): no open Dependabot or code scanning alert, and
      # no draft advisory with an open fix PR in its private fork. github.token reads none
      # of the three, so SECURITY_GATE_TOKEN (read-only PAT, see TRAPS) does; a missing
      # token or a failed call counts as not clear. The repository is public, so the
      # comment and the log never say which check found something, how many, or what: a
      # public alert would explain it, so naming it announces a private one. A read that
      # fails is an access fault, not a finding: the log names its number and HTTP status.
      - name: Security gate
        id: security
        if: steps.gate.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_TOKEN: ${{ secrets.SECURITY_GATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.number }}
        run: |
          skip() {
            echo "release skipped: a maintainer check is not clear"
            gh pr comment "$PR" --body "Release skipped: a maintainer check is not clear. Clear it, then run \`release-train\` by hand with \`action: release\`."
            exit 0
          }
          # sec <n> <path> [gh flags]: one read of the gate. <n> numbers the read in the log:
          # 1 Dependabot alerts, 2 code scanning alerts, 3 draft advisories and the open PRs of
          # each private fork (one number: a failed fork read must not tell the public log
          # that a private fork exists). A failed read says its number and HTTP status on stderr (stdout
          # is the read's result), never the error body, which can name an advisory. A
          # non-empty result is not a failure and stays silent (D1123).
          sec() {
            n=$1; shift
            err="${RUNNER_TEMP:-/tmp}/security-gate.err"
            if GH_TOKEN="$SEC_TOKEN" gh api --paginate "$@" 2>"$err"; then return 0; fi
            status=$(grep -o -m1 'HTTP [0-9][0-9][0-9]' "$err" || true)
            echo "security gate: read $n failed (${status:-no status})" >&2
            return 1
          }

          if [ -z "$SEC_TOKEN" ]; then
            echo "security gate: token is empty"
            skip
          fi
          open=$(sec 1 "repos/$GH_REPO/dependabot/alerts?state=open&per_page=100" --jq '.[].number') || skip
          [ -z "$open" ] || skip
          open=$(sec 2 "repos/$GH_REPO/code-scanning/alerts?state=open&per_page=100" --jq '.[].number') || skip
          [ -z "$open" ] || skip
          forks=$(sec 3 "repos/$GH_REPO/security-advisories?state=draft&per_page=100" --jq '.[].private_fork.full_name // empty') || skip
          for fork in $forks; do
            open=$(sec 3 "repos/$fork/pulls?state=open&per_page=100" --jq '.[].number') || skip
            [ -z "$open" ] || skip
          done
          echo "clear=true" >> "$GITHUB_OUTPUT"

      # The only step that merges. RELEASE_PLEASE_TOKEN, never github.token (see TRAPS).
      - name: Merge the release PR
        if: steps.security.outputs.clear == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.number }}
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          gh pr merge "$PR" --squash --match-head-commit "$SHA"
          gh pr comment "$PR" --body "Release: merged. release-please cuts the tag next."
