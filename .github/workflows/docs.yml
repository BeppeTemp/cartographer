name: docs

# Publishes docs/ to GitHub Pages via MkDocs Material. The source of truth
# stays the markdown in docs/ (updated in the same PR as the code, see
# docs/index.md §Documentation maintenance rules); this only renders it.
#
# The same site carries the static Atlas demo under /demo/ (D745), built from
# demo/astronomy by demo/build.sh. CHANGELOG.md is among the paths because a
# release-please merge touches it: every release republishes the demo, so it
# shows the Atlas of the latest version.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "demo/**"
      - "web/**"
      - "!web/e2e/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "demo/**"
      - "web/**"
      - "!web/e2e/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # demo/build.sh names the release the demo was built from: it needs the tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material==9.6.14
      # --strict turns broken internal links and nav typos into build failures,
      # so a PR that moves a page can't silently break the published site.
      - run: mkdocs build --strict
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --silent
      # After mkdocs, which empties site/ on every build.
      - run: demo/build.sh site/demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy is serialised: a PR build shares nothing with Pages, and
    # one deploy stuck in the group used to queue or cancel every later run.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
