name: Preview image
# The tag in the run title: release-train.yml finds the release candidate by it.
run-name: Preview image ${{ inputs.tag }}

# A server image for trying an unreleased main on a real deployment before the
# release PR is merged (D303). It publishes ONLY ghcr.io/…:<tag>: no `latest`,
# no GitHub release, no Homebrew cask, no MCP Registry entry — those belong to
# release.yml and a `v*` tag, which is why a preview is not a pushed tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag, e.g. v0.18.0-rc.1"
        required: true

permissions:
  contents: read

jobs:
  # Renders the README film from the sources being released (D1068). Parallel to the image, no `needs` either
  # way: a red film makes the run fail, release-train.yml then finds no successful candidate and the train skips.
  # The caller grants the most the called workflow's `publish` job holds (contents: write); its `render` job,
  # which runs the checked-out code, is read-only and publish only acts on main.
  film:
    permissions:
      contents: write
    uses: ./.github/workflows/film.yml

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # A plain vX.Y.Z here would overwrite the image a real release publishes
      # under the same tag; a pre-release suffix is mandatory.
      - name: Require a pre-release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$'; then
            echo "::error::tag '$TAG' must be vX.Y.Z-<suffix> (D303)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The candidate is started before anything is published (D995): a red smoke
      # fails the run here, and release-train.yml then never finds a successful
      # candidate. amd64 only, the runner's own architecture; the push below
      # reuses its layers from the cache and adds arm64.
      - name: Build the candidate for the smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: cartographer:smoke
          build-args: |
            VERSION=${{ inputs.tag }}
          cache-to: type=gha,mode=max
      - name: Smoke the candidate
        env:
          TAG: ${{ inputs.tag }}
        run: test/smoke/image.sh cartographer:smoke "$TAG"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          build-args: |
            VERSION=${{ inputs.tag }}
          tags: |
            ghcr.io/beppetemp/cartographer:${{ inputs.tag }}
