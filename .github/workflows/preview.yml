name: Preview image
# The tag in the run title: release-train.yml finds the release candidate by it.
run-name: Preview image ${{ inputs.tag }}

# A server image for trying an unreleased main on a real deployment before the
# release PR is merged (D303). It publishes ONLY ghcr.io/…:<tag>: no `latest`,
# no GitHub release, no Homebrew cask, no MCP Registry entry — those belong to
# release.yml and a `v*` tag, which is why a preview is not a pushed tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag, e.g. v0.18.0-rc.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # The README film is rendered from the candidate's sources (the head of main on
  # Saturday), and a failed render fails this run, so release-train.yml never
  # merges the release PR on it (D1068). No `needs` either way: it runs in
  # parallel with the image.
  film:
    permissions:
      contents: write
    uses: ./.github/workflows/film.yml

  docker:
    runs-on: ubuntu-latest
    steps:
      # A plain vX.Y.Z here would overwrite the image a real release publishes
      # under the same tag; a pre-release suffix is mandatory.
      - name: Require a pre-release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$'; then
            echo "::error::tag '$TAG' must be vX.Y.Z-<suffix> (D303)" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # The candidate is started before anything is published (D995): a red smoke
      # fails the run here, and release-train.yml then never finds a successful
      # candidate. amd64 only, the runner's own architecture; the push below
      # reuses its layers from the cache and adds arm64.
      - name: Build the candidate for the smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: cartographer:smoke
          build-args: |
            VERSION=${{ inputs.tag }}
          cache-to: type=gha,mode=max
      - name: Smoke the candidate
        env:
          TAG: ${{ inputs.tag }}
        run: test/smoke/image.sh cartographer:smoke "$TAG"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          build-args: |
            VERSION=${{ inputs.tag }}
          tags: |
            ghcr.io/beppetemp/cartographer:${{ inputs.tag }}
