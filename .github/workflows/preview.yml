name: Preview image
# The tag in the run title: release-train.yml finds the release candidate by it.
run-name: Preview image ${{ inputs.tag }}

# A release candidate for trying an unreleased main before the release PR is
# merged (D303, D1192): the server image ghcr.io/…:<tag> for a deployment, and a
# GitHub pre-release <tag> with the GoReleaser binaries for a native service and
# client. Nothing stable: no `latest` image, no Homebrew cask, no MCP Registry
# entry, GitHub's "latest release" untouched — those belong to release.yml, which
# a candidate tag never starts (its tag filter, and the default token here).
# The binaries are published only after the image passed its smoke and was pushed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag, e.g. v0.18.0-rc.1"
        required: true

permissions:
  contents: read

jobs:
  # Renders the README film from the sources being released (D1068). Parallel to the image, no `needs` either
  # way: a red film makes the run fail, release-train.yml then finds no successful candidate and the train skips.
  # The caller grants the most the called workflow's `publish` job holds (contents: write); its `render` job,
  # which runs the checked-out code, is read-only and publish only acts on main.
  film:
    permissions:
      contents: write
    uses: ./.github/workflows/film.yml

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # A plain vX.Y.Z here would overwrite the image a real release publishes
      # under the same tag; a pre-release suffix is mandatory.
      - name: Require a pre-release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$'; then
            echo "::error::tag '$TAG' must be vX.Y.Z-<suffix> (D303)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The candidate is started before anything is published (D995): a red smoke
      # fails the run here, and release-train.yml then never finds a successful
      # candidate. amd64 only, the runner's own architecture; the push below
      # reuses its layers from the cache and adds arm64.
      - name: Build the candidate for the smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: cartographer:smoke
          build-args: |
            VERSION=${{ inputs.tag }}
          cache-to: type=gha,mode=max
      - name: Smoke the candidate
        env:
          TAG: ${{ inputs.tag }}
        run: test/smoke/image.sh cartographer:smoke "$TAG"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          build-args: |
            VERSION=${{ inputs.tag }}
          tags: |
            ghcr.io/beppetemp/cartographer:${{ inputs.tag }}

  # The candidate's binaries as a GitHub pre-release (D1192), after the image: a
  # failed smoke or push publishes nothing, and a failure here makes the run red,
  # so release-train.yml finds no successful candidate and the train skips.
  binaries:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/delete; this job only
    steps:
      - name: Require a pre-release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$'; then
            echo "::error::tag '$TAG' must be vX.Y.Z-<suffix> (D303)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache: this job publishes what it builds (D1020).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Local only, never pushed: GoReleaser reads {{ .Version }} from it, so the
      # binaries print the candidate's tag. -f: a same-day rebuild finds the tag of
      # the earlier candidate already fetched. Another day's candidate of the same
      # commit carries a tag on HEAD too, hence GORELEASER_CURRENT_TAG below.
      - name: Tag the commit locally
        env:
          TAG: ${{ inputs.tag }}
        run: git tag -f "$TAG" "$GITHUB_SHA"
      # The real release mode, so names and sha256sums.txt are a stable release's.
      # `publish` keeps the GitHub upload and the tap push from running; `homebrew`
      # too, because the cask pipe renders its tap token template in its run step,
      # before publishing (goreleaser internal/pipe/cask), and this job holds no tap
      # token; `homebrew` is a `release --skip` key of v2. No SBOMs (no syft for a candidate).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --skip=publish,announce,sbom,homebrew
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
      # The assets are the files sha256sums.txt names, under those names (a raw
      # binary sits in dist/ under its build path, so artifacts.json maps it).
      - name: Collect the assets and smoke the binary
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir rc
          while read -r _ name; do
            path=$(jq -r --arg n "$name" '[.[] | select(.name == $n and (.type == "Archive" or .type == "Binary"))][0].path // empty' dist/artifacts.json)
            [ -n "$path" ] || { echo "::error::no artifact for $name in dist/artifacts.json" >&2; exit 1; }
            cp "$path" "rc/$name"
          done < dist/sha256sums.txt
          cp dist/sha256sums.txt rc/
          (cd rc && sha256sum -c sha256sums.txt)
          got=$(rc/cartographer-linux-amd64 version)
          if [ "$got" != "$TAG" ]; then
            echo "::error::the candidate binary prints '$got', want '$TAG'" >&2
            exit 1
          fi
          ls -l rc
      # github.token, never a PAT: a tag it creates starts no `push` workflow, the
      # second guard after release.yml's tag filter. --latest=false keeps GitHub's
      # latest release where it is. A same-day rebuild replaces that day's candidate;
      # other candidates are kept (release.yml deletes them with the release).
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          # A tag left by a failed earlier run would pin the release to its commit,
          # not this one. The tag is a candidate's (checked above), never a release's.
          if gh api "repos/$GH_REPO/git/refs/tags/$TAG" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
          fi
          version=${TAG%%-*}
          gh release create "$TAG" rc/* --prerelease --latest=false --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Release candidate of ${version}, built from ${GITHUB_SHA}. Not a release: it is never offered as an update. Install it with CARTOGRAPHER_INSTALL_TAG=${TAG} (install.sh or install.ps1); the image is ghcr.io/beppetemp/cartographer:${TAG}."
