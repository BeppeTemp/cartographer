name: plan-gate-queue

# The `plan-gate` required check, reported in the merge queue (D1590). The rule
# itself is plan-gate.yml's and ran on the pull request; a queued PR cannot change,
# so here the check only has to exist. Nothing is checked out, nothing runs from
# the PR, no secret: the invariants of plan-gate.yml, pinned by
# internal/repodocs/plan_gate_test.go, hold here a fortiori.
on:
  merge_group:

permissions:
  contents: read

jobs:
  plan-gate:
    name: plan-gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "the size rule ran on the pull request"
