name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ready for a merge queue (D1592), which is not available on a user-owned
  # repository: inert today, the heavy legs run on push to main.
  merge_group:
  # The real-forge job (`forge`) on demand, from the Actions tab or
  # `gh workflow run ci.yml --ref <branch>`; every other job runs too (D996).
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight. Runs on main coalesce: one
# running and the newest pending, because a group keeps at most one pending run
# and replaces an older one without cancelling the running one; `main-status`
# then names the range since the last green commit. A merge_group and a manual
# run are keyed by their own commit and never cancelled: GitHub supersedes a
# stale merge group itself, and cancelling one here would eject the PRs queued in it.
concurrency:
  group: ci-${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# On main every job runs, and a red main opens (or updates) a `ci-red` issue.
# A contributor's PR runs the light checks: `test`, the web legs (when the
# frontend changed) and the two PR-title workflows. A maintainer's PR is gated
# by `make signoff` (hosted by default: this workflow, dispatched on the branch)
# and runs `changes`, `gate`, which looks for the signoff status of its head
# sha, and, as any PR does, `helm` and `forge` when their paths changed (the
# `changes` filter). `gate` is the one required CI check: the
# `test-windows` and `web` aggregators no longer run on a PR. The heavy legs
# (Windows, macOS, Linux without systemd, docker, demo-edge) run on push to main, on workflow_dispatch
# and on `merge_group` (D1592): the account runs about five jobs at a time and
# twenty per PR was the bottleneck. A Windows- or macOS-only break is caught by
# the hosted train gate; `main` is the net for a build-host gate and for a
# contributor's merge, tracked by `ci-red`.
jobs:
  # Which of the slower jobs this PR needs: `web`, `forge` and `helm` only, the other
  # outputs stay in the table pinned by a test but no PR job reads them (the
  # heavy legs do not run on a PR, D1592). On merge_group and push this job is
  # skipped, and `result != success` means "run everything". A path filter at
  # the workflow level would leave a required check that never reports,
  # blocking the PR; a job skipped by `if:` reports as passed.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      windows: ${{ steps.filter.outputs.windows }}
      demo: ${{ steps.filter.outputs.demo }}
      tf: ${{ steps.filter.outputs.tf }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
      forge: ${{ steps.filter.outputs.forge }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      # The table lives in scripts/ci-filters.sh, pinned by a test (D994).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          # The release PR's skip of `web` and `helm` is for a branch of this repository only:
          # a fork can name a branch release-please--* (scripts/ci-filters.sh, #2441).
          HEAD_IN_BASE_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # GitHub answers 5xx for the files of a just-opened PR (its diff is not computed yet):
          # asked again with a backoff; any other error ends the job.
          err=$(mktemp)
          for try in 1 2 3 4 5; do
            if files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' 2>"$err"); then break; fi
            if [ "$try" = 5 ] || ! grep -qE 'HTTP 5[0-9][0-9]' "$err"; then cat "$err" >&2; exit 1; fi
            sleep $((try * 10))
          done
          printf '%s\n' "$files"
          printf '%s\n' "$files" | scripts/ci-filters.sh "$HEAD_REF" >> "$GITHUB_OUTPUT"

  # On a push to main: a green dispatched run of this workflow (the hosted train gate) on a
  # commit with the same tree already tested exactly this tree, so the heavy legs skip, and
  # `main-status` and `gate` read the skip as green (D2415). A train merges only onto
  # the main it was gated on, so its push finds one; a contributor's merge and a build-host gate
  # do not. Its runners are then free for the next train's gate. It fails toward running every leg (green=false).
  same-tree:
    name: same-tree
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      green: ${{ steps.find.outputs.green }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-same-tree.sh
          sparse-checkout-cone-mode: false
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/ci-same-tree.sh >> "$GITHUB_OUTPUT"

  # `make gate` split over four runners: `checks` runs its fmt-check, vet and race and the
  # harnesses after it, the three shards its `go test ./...` (scripts/test-shard.sh, every
  # package's tests dealt round-robin, internal/repodocs included: TEST_SHARD_REPODOCS). `gate` and
  # `main-status` read the matrix's one result, red when any leg is.
  # Not run on a maintainer's PR: `make signoff` ran the gate before the push and
  # `gate` below checks its status. A maintainer is GitHub's author_association
  # (a PR cannot forge it), not a bot, and not the release PR, which the
  # maintainer's token opens and which must be tested.
  test:
    name: test (${{ matrix.leg }})
    needs: same-tree
    if: >-
      !cancelled() && needs.same-tree.outputs.green != 'true' &&
      (github.event_name != 'pull_request' ||
      !((github.event.pull_request.author_association == 'OWNER' ||
         github.event.pull_request.author_association == 'MEMBER' ||
         github.event.pull_request.author_association == 'COLLABORATOR') &&
        github.event.pull_request.user.type != 'Bot' &&
        !startsWith(github.head_ref, 'release-please--')))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [checks, 0, 1, 2]
    env:
      # Feature PRs leave docs/decisions.md alone; the release PR regenerates
      # it and is the one place its staleness is checked (D328).
      CARTOGRAPHER_STRICT_DECISION_INDEX: ${{ startsWith(github.head_ref, 'release-please--') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The git-backed Go tests (gitx, kb, bootstrap) need an identity and the
      # "master" initial branch on a bare environment (same setup as the
      # Dockerfile test stage). smoke-http and e2e below do NOT get this
      # identity: they isolate their own git config and run with none, so a
      # host without an identity is exercised there (D996).
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      # `make gate`, the command CONTRIBUTING.md tells a contributor to run before opening a
      # PR, in its parts (gate: fmt-check vet test race); internal/repodocs_test pins the split.
      - if: matrix.leg == 'checks'
        run: make fmt-check
      - if: matrix.leg == 'checks'
        run: make vet
      - if: matrix.leg == 'checks'
        run: make race
      - if: matrix.leg != 'checks'
        env:
          TEST_SHARD_REPODOCS: '1'
          SHARD: ${{ matrix.leg }}
        run: ./scripts/test-shard.sh 3 "$SHARD"
      - if: matrix.leg == 'checks'
        run: make smoke-http
      - if: matrix.leg == 'checks'
        run: make smoke
      - if: matrix.leg == 'checks'
        run: make e2e
      - if: matrix.leg == 'checks'
        run: make test-install

  # The Windows leg, split across runners: the git-backed packages are ~13x
  # slower there than on ubuntu, and a single job waited ~13 minutes on
  # internal/mcpserver alone, close to its 20m test timeout (D785). Six shards
  # since #2159: with four, mcpserver and cmd/cartographer reached it by
  # chance. Each shard
  # runs a round-robin slice of every package's tests (scripts/test-shard.sh);
  # fmt-check and vet are platform-independent and run on `test`, which also
  # vets with GOOS=windows. Minutes on standard runners are free for a public
  # repository, so the split costs nothing.
  #
  # Push to main, a manual run and merge_group, never on a PR (D1592): a
  # Windows-only break is caught by the hosted train gate, which dispatches this
  # workflow; `main` is the net for a build-host gate and for a contributor's
  # merge, tracked by `ci-red`.
  test-windows-shard:
    name: test-windows (${{ matrix.shard }}/6)
    needs: same-tree
    if: "!cancelled() && github.event_name != 'pull_request' && needs.same-tree.outputs.green != 'true'"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        # The scripts are POSIX shell and the runner's default shell is
        # PowerShell. Git for Windows ships bash.
        shell: bash
    steps:
      # Defender scans every file the git-backed tests create: turning it off
      # took about a fifth off the tests (internal/mcpserver 190s -> 155s).
      # The rest of the gap with ubuntu is git process creation. The runner is
      # throwaway. Only a speed-up: a runner whose Defender service is down
      # fails the cmdlet with 0x800106ba (#936), and that must not fail the leg.
      - name: Disable Defender real-time scanning
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      - run: ./scripts/test-shard.sh 6 ${{ matrix.shard }}

  # install.ps1 against a local fixture release built from this commit, under
  # both shells a user may run it in: PowerShell 7 and Windows PowerShell 5.1,
  # whose quirks (TLS defaults, native stderr) are the ones that bite (D252).
  # smoke-http, e2e and the POSIX test-install suite are sh harnesses and stay
  # on ubuntu.
  test-windows-install:
    name: test-windows (install.ps1)
    needs: same-tree
    if: "!cancelled() && github.event_name != 'pull_request' && needs.same-tree.outputs.green != 'true'"
    runs-on: windows-latest
    steps:
      - name: Disable Defender real-time scanning
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: install.ps1
        shell: pwsh
        run: |
          go build -ldflags "-X main.version=v9.9.9" -o "$env:RUNNER_TEMP\new\cartographer.exe" ./cmd/cartographer
          go build -ldflags "-X main.version=v9.9.8" -o "$env:RUNNER_TEMP\old\cartographer.exe" ./cmd/cartographer
          foreach ($shell in 'pwsh', 'powershell') {
            ./test/install/windows/run.ps1 -Shell $shell -NewBin "$env:RUNNER_TEMP\new\cartographer.exe" -OldBin "$env:RUNNER_TEMP\old\cartographer.exe"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  # Collects the Windows legs for `main-status`; not a required check any more
  # (`gate` is) and not run on a PR. Kept as one job because a matrix renames
  # its legs. In the merge queue a skipped leg is a defect and fails it.
  test-windows:
    name: test-windows
    needs: [test-windows-shard, test-windows-install]
    if: "!cancelled() && github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "legs: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
          if [ "$EVENT" = merge_group ]; then
            case " $RESULTS " in *" skipped "*) exit 1 ;; esac
          fi

  # The frontend, deliberately its own job rather than a step of `test`.
  #
  # `make gate` stays Go-only so a contributor changing Go code needs no Node
  # toolchain (D227); what protects the committed bundle there is a pure-Go
  # provenance test in internal/webui. This job is what actually builds the
  # frontend and runs its tests, and it only needs to run when the frontend
  # changed (the `changes` job decides), and after every merge on main, so a
  # browser regression is seen on the merge that caused it (D672). It is a
  # collected by `gate`: a red leg blocks a contributor's PR like a red `test`.
  #
  # Two legs, collected by `gate` (and by `web` on main): the @video test (the
  # growth replay's export, about two minutes of software rendering) was half
  # the browser suite, so it runs beside the rest, together with the unit
  # tests and the bundle checks, instead of after them (D785).
  web-leg:
    name: web (${{ matrix.leg }})
    needs: [changes, same-tree]
    # The same maintainer exclusion as `test`.
    if: >-
      !cancelled() && needs.same-tree.outputs.green != 'true' &&
      (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') &&
      (github.event_name != 'pull_request' ||
      !((github.event.pull_request.author_association == 'OWNER' ||
         github.event.pull_request.author_association == 'MEMBER' ||
         github.event.pull_request.author_association == 'COLLABORATOR') &&
        github.event.pull_request.user.type != 'Bot' &&
        !startsWith(github.head_ref, 'release-please--')))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: video
            grep: --grep @video
          - leg: browser
            grep: --grep-invert @video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # One install for the whole leg; the make targets skip theirs (NPM_CI=).
      - run: cd web && npm ci --silent
      - if: matrix.leg == 'video'
        run: make web-check NPM_CI=
      - if: matrix.leg == 'video'
        run: make web-test NPM_CI=
      - if: matrix.leg == 'video'
        name: Web wall-clock budget (alone)
        run: make web-perf NPM_CI=
      # The browser suite (D228) drives bin/cartographer, which commits to the
      # fixture KBs it initialises, so git needs an identity here too.
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      # The browser binary is cached by Playwright version (D328). The OS packages
      # it needs are installed every run, but their .deb files are cached: the
      # runner's Ubuntu mirror sometimes serves them at a few kB/s (20 MB took 10
      # minutes), and apt installs a cached file without downloading it.
      - id: playwright
        run: |
          echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Keyed by runner image too: a new image restores the previous files, apt
      # downloads only the packages that changed, and the new key saves them.
      # Only the .deb files: apt makes its partial/ directory unreadable to the
      # runner user, and the save would fail on it. Saved right after the install,
      # not at the end of the job, so a red browser suite still keeps them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: debs
        with:
          path: ~/.cache/apt-archives/*.deb
          key: playwright-debs-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image }}
          restore-keys: playwright-debs-${{ runner.os }}-${{ steps.playwright.outputs.version }}-
      - name: Keep apt's downloads in the cached directory
        run: |
          mkdir -p "$HOME/.cache/apt-archives"
          printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt-get::APT::Keep-Downloaded-Packages "true";\n' \
            "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-cached-archives >/dev/null
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd web && npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: cd web && npx playwright install-deps chromium
      - if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives/*.deb
          key: ${{ steps.debs.outputs.cache-primary-key }}
      - run: make e2e-web NPM_CI= E2E_WEB_ARGS="${{ matrix.grep }}"

  # Collects the web legs for `main-status`; not run on a PR (`gate` reads the legs).
  web:
    name: web
    needs: web-leg
    if: "!cancelled() && github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.web-leg.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "legs: $RESULT"
          case "$RESULT" in failure|cancelled) exit 1 ;; esac
          # Skipped by `changes` on a PR is by design; on merge_group every leg runs.
          if [ "$EVENT" = merge_group ] && [ "$RESULT" = skipped ]; then exit 1; fi

  # The required check, and the only required CI job (with `pr-title` and
  # `plan-gate`). On a maintainer's PR it passes iff a maintainer's `signoff`
  # status exists on the head sha (scripts/ci-gate.sh); elsewhere it collects
  # `test` and the web legs.
  #
  # **Never add an `if` that can skip this job, on any event or at any level.** A
  # job skipped by `if:` reports as passed, and a skipped required check is a
  # hole (D1592). The only condition is `!cancelled()`.
  gate:
    name: gate
    needs: [changes, same-tree, test, web-leg]
    if: "!cancelled()"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          WEB_RESULT: ${{ needs.web-leg.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_WEB: ${{ needs.changes.outputs.web }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_TREE: ${{ needs.same-tree.outputs.green }}
          REPO: ${{ github.repository }}
        run: scripts/ci-gate.sh

  # The demo Worker (Node only) and the demo's Terraform: a Worker change used
  # to ride the web video leg and a deploy/demo-only PR skipped it. Not a
  # required check, but main-status watches it.
  demo-edge:
    name: demo-edge
    needs: same-tree
    if: "!cancelled() && github.event_name != 'pull_request' && needs.same-tree.outputs.green != 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - run: make demo-worker-test
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
      - run: make demo-tf-check

  # The Helm chart (D1441): helm lint, helm template over deploy/helm/cartographer/ci and the
  # assertions of test/helm/run.sh. Outside `make gate`, like the demo's Terraform: the gate
  # stays Go-only. On a PR it runs only when the PR touches the chart's paths, like `forge`;
  # on push, merge_group and dispatch it always runs. Not a required check (`gate` is the
  # one, D1592): main-status watches it.
  helm:
    name: helm
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.helm == 'true')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Helm
        run: scripts/install-helm.sh "$RUNNER_TEMP/bin"
      - name: make helm-check
        env:
          BIN: ${{ runner.temp }}/bin
        run: PATH="$BIN:$PATH" make helm-check

  # The container's own test stage and a start of the server and Surveyor images
  # (D995, D1440): nothing else builds the Dockerfile before release day. Not a required check, main-status
  # watches it (the required set is the ruleset's, a maintainer's to change).
  docker:
    name: docker
    needs: same-tree
    if: "!cancelled() && github.event_name != 'pull_request' && needs.same-tree.outputs.green != 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # vet + test in a clean alpine; never pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The runtime image the smoke starts.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: cartographer:ci
          build-args: |
            VERSION=v0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: test/smoke/image.sh cartographer:ci v0.0.0-ci
      # The Surveyor image: the `surveyor` stage, same builder layers (D1440).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: surveyor
          load: true
          push: false
          tags: cartographer-surveyor:ci
          build-args: |
            VERSION=v0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: test/smoke/surveyor-image.sh cartographer-surveyor:ci v0.0.0-ci
      # The demo image is built on this one (deploy/demo/Dockerfile), so a
      # Dockerfile change is checked against it too.
      - run: make demo-smoke DEMO_BASE=cartographer:ci

  # The sync scenarios against a real Forgejo and a real GitLab CE (D996):
  # test/forge/run.sh starts the pinned container itself, so the same script is
  # the by-hand run. GitLab CE boots in minutes, so this is not on every PR: the
  # release PR, a PR that touches test/forge/ (or this file), and a manual run.
  # Never on main, and not a required check; the release PR is where its result
  # is read.
  forge:
    name: forge (${{ matrix.forge }})
    needs: changes
    if: "!cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.forge == 'true')))"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        forge: [forgejo, gitlab]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: test/forge/run.sh ${{ matrix.forge }}

  # A client upgraded from the previous stable release to this build (#1173):
  # test/e2e/optional/26_upgrade_from_previous.sh builds the old tag from a
  # throwaway worktree, so it needs the tags. The release PR and a manual run
  # only; not in main-status (skipped on push) and not a required check. No
  # "Configure git for tests": run.sh isolates its own git config (D996).
  upgrade-e2e:
    name: upgrade-e2e
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous release is the newest stable tag
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The module cache is keyed on HEAD's go.sum: the old tag may need a
      # module it lacks.
      - run: make e2e-upgrade
        env:
          E2E_UPGRADE_ONLINE: "1"

  # The macOS leg (D997): the launchd agent, install.sh against a real service
  # and the Cask GoReleaser renders, each on a real runner. It registers a real
  # job under the runner's own HOME (internal/service/homeguard.go refuses a
  # sandbox HOME). Push to main, a manual run and merge_group (D1592). Not a
  # required check; main-status watches it.
  test-macos:
    name: test-macos
    needs: same-tree
    if: "!cancelled() && github.event_name != 'pull_request' && needs.same-tree.outputs.green != 'true'"
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the snapshot version is computed from the tags
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # this job runs GoReleaser: nothing it builds may come from a shared cache (D1020)
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      - name: Build the two versions
        run: |
          go build -ldflags "-X main.version=v9.9.9" -o "$RUNNER_TEMP/new/cartographer" ./cmd/cartographer
          go build -ldflags "-X main.version=v9.9.8" -o "$RUNNER_TEMP/old/cartographer" ./cmd/cartographer
      - name: The per-user launchd domain exists
        run: launchctl print "gui/$(id -u)" >/dev/null
      - name: launchd service
        run: test/macos/service.sh "$RUNNER_TEMP/new/cartographer"
      - name: Menu-bar icon
        run: test/macos/tray.sh "$RUNNER_TEMP/new/cartographer"
      - name: install.sh against a real service
        run: test/macos/install.sh "$RUNNER_TEMP/old/cartographer" "$RUNNER_TEMP/new/cartographer"
      # Never published: --skip=publish needs no HOMEBREW_TAP_TOKEN. Only the Cask
      # is read, so the SBOMs (which need syft, installed by release.yml) are skipped.
      # The download is the only network step: install-only, retried in shell
      # (a GitHub 504 failed main more than once), then goreleaser runs directly.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: goreleaser-install
        continue-on-error: true
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Install GoReleaser again after a failed download
        if: steps.goreleaser-install.outcome == 'failure'
        run: |
          for i in 1 2 3; do
            sleep $((i * 15))
            if brew install goreleaser; then exit 0; fi
          done
          exit 1
      - name: GoReleaser snapshot build of every target
        run: goreleaser release --snapshot --clean --skip=publish,sbom
      - name: The Cask from a local tap
        run: test/macos/cask.sh dist

  # Linux without systemd (D1682): `setup` and the service verbs on the cron
  # backend, in an Alpine (musl, busybox crond) and a Debian (glibc, Vixie cron)
  # container, neither with an init. Push to main, a manual run and merge_group
  # (D1592). Not a required check; main-status watches it.
  test-linux-nosystemd:
    name: test-linux-nosystemd
    needs: same-tree
    if: "!cancelled() && github.event_name != 'pull_request' && needs.same-tree.outputs.green != 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make test-linux

  # The quarantined Go tests (test/quarantine.tsv, D2294), outside every verdict:
  # each active entry runs alone in its package and the job summary says which passed, so a test
  # that no longer fails shows. Push to main only, never on a dispatched gate: a branch's code does
  # not run beside this job's `issues: write`, which only the last step holds. Not in
  # `main-status`'s needs nor in HOSTED_JOBS (scripts/signoff.sh), and continue-on-error: a
  # quarantined test turns neither main nor a gate red. An entry past its date is back in the gate,
  # and the last step says so once on its issue.
  quarantine:
    name: quarantine
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # a job with a write token restores no shared cache (D1020)
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      # The tests' output goes to the log, only the `quarantine:` lines to the summary.
      - name: Run the quarantined tests
        run: |
          set -o pipefail
          { echo '```'; scripts/quarantine.sh --run; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # One comment per issue and expiry date: a lookup that fails skips the issue this time
      # rather than risk a second one.
      - name: Say on its issue that an entry expired
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          expired=$(scripts/quarantine.sh --expired)
          while IFS=$'\t' read -r pkg name issue _ expires; do
            [ -n "$issue" ] || continue
            note="quarantine expired on $expires: the test is back in the gate; fix it, or renew the line with a reason"
            if ! bodies=$(gh issue view "$issue" -R "$REPO" --json comments --jq '.comments[].body'); then
              echo "cannot read the comments of #$issue ($pkg.$name): not commenting this time"
              continue
            fi
            if grep -qF "quarantine expired on $expires:" <<<"$bodies"; then continue; fi
            gh issue comment "$issue" -R "$REPO" -b "$note" || echo "cannot comment on #$issue ($pkg.$name)"
          done <<<"$expired"

  # The PR title and body lint (the required `pr-title` check) is its own
  # workflow, pr-title.yml: it re-runs on `edited`, which this one must not (D865).

  # A red main is a signal, not something the next PR discovers (D672): the
  # first failing push opens a `ci-red` issue, later ones comment on it, and the
  # first green push closes it. A push whose legs skipped because a green dispatched run tested
  # its tree (`same-tree`) is green: no need failed. The body names, for each red leg, whether the gate
  # of each train in the range ran it (scripts/main-red.sh, from the `Gate:` line
  # of the train PR); that part fails open, it never keeps the issue from opening.
  main-status:
    name: main-status
    needs: [test, test-windows, web, demo-edge, docker, helm, test-macos, test-linux-nosystemd]
    if: github.event_name == 'push' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      contents: read
      pull-requests: read
    steps:
      # The one script, without credentials; a checkout that fails leaves the issue
      # without its coverage lines, not without the issue.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
          sparse-checkout: scripts/main-red.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RED: ${{ contains(needs.*.result, 'failure') }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          # The job results reach the script through the environment only, never its text.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          open=$(gh issue list -R "$REPO" --label ci-red --state open --json number -q '.[0].number')
          if [ "$RED" = true ]; then
            # Runs on main coalesce, so $SHA is not necessarily the commit that
            # broke: name the range since the newest green push run instead.
            green=$(gh run list -R "$REPO" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha -q '.[0].headSha // empty')
            if [ -n "$green" ]; then
              since="commits since the last green run: https://github.com/$REPO/compare/$green...$SHA"
            else
              since="no earlier green run found"
            fi
            body="CI failed on main at $SHA ($since): $RUN"
            # What the train gates of the range ran; the script exits 0 on its own failures, so
            # a non-zero exit means it is missing or broken: the issue opens anyway, and still
            # ends with its Found-by line.
            coverage=$(bash scripts/main-red.sh "$REPO" "$SHA" "$green") ||
              coverage=$(printf '%s\n' "$coverage" "Gate coverage: could not be read (scripts/main-red.sh)" "Found-by: main-ci")
            body=$(printf '%s\n\n%s' "$body" "$coverage")
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$REPO" -b "$body"
            else
              gh label create ci-red -R "$REPO" -c B60205 -d "main is red" 2>/dev/null || true
              gh issue create -R "$REPO" -t "main is red" -l ci-red -b "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$REPO" -c "Green again at $SHA: $RUN"
          fi
