name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The real-forge job (`forge`) on demand, from the Actions tab or
  # `gh workflow run ci.yml --ref <branch>`; every other job runs too (D996).
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight. Runs on main are never
# cancelled: each merge gets its own record, so on push the group is the commit.
# A group keeps at most one pending run, and a shared `main` group dropped the
# middle one of three quick merges.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# On main every job runs, and a red main opens (or updates) a `ci-red` issue.
# On a feature PR `test-windows` runs only when the PR touches a package with
# platform-specific code (D672): it is the slowest leg even split across
# runners (D785), but leaving it off every PR let a Windows-only break sit on main for
# two days. The release PR runs everything, so no release ships without it.
jobs:
  # Which of the slower jobs this PR needs. A path filter at the workflow level
  # would leave a required check that never reports, blocking the PR; a job
  # skipped by `if:` reports as passed.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      windows: ${{ steps.filter.outputs.windows }}
      demo: ${{ steps.filter.outputs.demo }}
      tf: ${{ steps.filter.outputs.tf }}
      docker: ${{ steps.filter.outputs.docker }}
      forge: ${{ steps.filter.outputs.forge }}
    steps:
      # The table lives in scripts/ci-filters.sh, pinned by a test (D994).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          printf '%s\n' "$files"
          printf '%s\n' "$files" | scripts/ci-filters.sh "$HEAD_REF" >> "$GITHUB_OUTPUT"

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Feature PRs leave docs/decisions.md alone; the release PR regenerates
      # it and is the one place its staleness is checked (D328).
      CARTOGRAPHER_STRICT_DECISION_INDEX: ${{ startsWith(github.head_ref, 'release-please--') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The git-backed Go tests (gitx, kb, bootstrap) need an identity and the
      # "master" initial branch on a bare environment (same setup as the
      # Dockerfile test stage). smoke-http and e2e below do NOT get this
      # identity: they isolate their own git config and run with none, so a
      # host without an identity is exercised there (D996).
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      # One command, the same one CONTRIBUTING.md tells a contributor to run
      # before opening a PR: gofmt + vet + test (documentation gates included,
      # internal/repodocs). Listing the steps separately here is how the two
      # answers to "what must be green" drift apart.
      - run: make gate
      - run: make smoke-http
      - run: make smoke
      - run: make e2e
      - run: make test-install

  # The Windows leg, split across runners: the git-backed packages are ~13x
  # slower there than on ubuntu, and a single job waited ~13 minutes on
  # internal/mcpserver alone, close to its 20m test timeout (D785). Each shard
  # runs a round-robin slice of every package's tests (scripts/test-shard.sh);
  # fmt-check and vet are platform-independent and run on `test`, which also
  # vets with GOOS=windows. Minutes on standard runners are free for a public
  # repository, so the split costs nothing.
  #
  # Push to main, the release PR, and a feature PR that touches
  # platform-specific code (D672). On push `changes` is skipped, hence
  # `result != success`; a failed `changes` runs it too rather than letting a PR
  # through untested.
  test-windows-shard:
    name: test-windows (${{ matrix.shard }}/4)
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.windows == 'true')"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        # The scripts are POSIX shell and the runner's default shell is
        # PowerShell. Git for Windows ships bash.
        shell: bash
    steps:
      # Defender scans every file the git-backed tests create: turning it off
      # took about a fifth off the tests (internal/mcpserver 190s -> 155s).
      # The rest of the gap with ubuntu is git process creation. The runner is
      # throwaway. Only a speed-up: a runner whose Defender service is down
      # fails the cmdlet with 0x800106ba (#936), and that must not fail the leg.
      - name: Disable Defender real-time scanning
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      - run: ./scripts/test-shard.sh 4 ${{ matrix.shard }}

  # install.ps1 against a local fixture release built from this commit, under
  # both shells a user may run it in: PowerShell 7 and Windows PowerShell 5.1,
  # whose quirks (TLS defaults, native stderr) are the ones that bite (D252).
  # smoke-http, e2e and the POSIX test-install suite are sh harnesses and stay
  # on ubuntu.
  test-windows-install:
    name: test-windows (install.ps1)
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.windows == 'true')"
    runs-on: windows-latest
    steps:
      - name: Disable Defender real-time scanning
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install.ps1
        shell: pwsh
        run: |
          go build -ldflags "-X main.version=v9.9.9" -o "$env:RUNNER_TEMP\new\cartographer.exe" ./cmd/cartographer
          go build -ldflags "-X main.version=v9.9.8" -o "$env:RUNNER_TEMP\old\cartographer.exe" ./cmd/cartographer
          foreach ($shell in 'pwsh', 'powershell') {
            ./test/install/windows/run.ps1 -Shell $shell -NewBin "$env:RUNNER_TEMP\new\cartographer.exe" -OldBin "$env:RUNNER_TEMP\old\cartographer.exe"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  # The required check. main's branch protection requires checks named
  # literally `test-windows` and `web`, and a matrix renames its legs, which
  # would silently un-protect the branch: one job per required name collects
  # its legs. Skipped legs (a PR outside platform-specific code) pass it.
  test-windows:
    name: test-windows
    needs: [test-windows-shard, test-windows-install]
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "legs: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  # The frontend, deliberately its own job rather than a step of `test`.
  #
  # `make gate` stays Go-only so a contributor changing Go code needs no Node
  # toolchain (D227); what protects the committed bundle there is a pure-Go
  # provenance test in internal/webui. This job is what actually builds the
  # frontend and runs its tests, and it only needs to run when the frontend
  # changed (the `changes` job decides), and after every merge on main, so a
  # browser regression is seen on the merge that caused it (D672). It is a
  # required check: a red `web` blocks the merge like a red `test`.
  #
  # Two legs, collected by the required `web` job below: the @video test (the
  # growth replay's export, about two minutes of software rendering) was half
  # the browser suite, so it runs beside the rest, together with the unit
  # tests and the bundle checks, instead of after them (D785).
  web-leg:
    name: web (${{ matrix.leg }})
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: video
            grep: --grep @video
          - leg: browser
            grep: --grep-invert @video
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: matrix.leg == 'video'
        run: make web-check
      - if: matrix.leg == 'video'
        run: make web-test
      - run: cd web && npm ci --silent
      # The browser suite (D228) drives bin/cartographer, which commits to the
      # fixture KBs it initialises, so git needs an identity here too.
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      # The browser binary is cached by Playwright version (D328); the OS
      # packages it needs are not cacheable and are installed every run.
      - id: playwright
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd web && npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: cd web && npx playwright install-deps chromium
      - run: make e2e-web E2E_WEB_ARGS="${{ matrix.grep }}"

  web:
    name: web
    needs: web-leg
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.web-leg.result }}
        run: |
          echo "legs: $RESULT"
          case "$RESULT" in failure|cancelled) exit 1 ;; esac

  # The demo Worker (Node only) and the demo's Terraform: a Worker change used
  # to ride the web video leg and a deploy/demo-only PR skipped it. Not a
  # required check, but main-status watches it.
  demo-edge:
    name: demo-edge
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.demo == 'true')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - run: make demo-worker-test
      - if: needs.changes.result != 'success' || needs.changes.outputs.tf == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - if: needs.changes.result != 'success' || needs.changes.outputs.tf == 'true'
        run: make demo-tf-check

  # The container's own test stage and a start of the image (D995): nothing else
  # builds the Dockerfile before release day. Not a required check, main-status
  # watches it (the required set is the ruleset's, a maintainer's to change).
  docker:
    name: docker
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # vet + test in a clean alpine; never pushed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The runtime image the smoke starts.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: cartographer:ci
          build-args: |
            VERSION=v0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: test/smoke/image.sh cartographer:ci v0.0.0-ci
      # The demo image is built on this one (deploy/demo/Dockerfile), so a
      # Dockerfile change is checked against it too.
      - run: make demo-smoke DEMO_BASE=cartographer:ci

  # The sync scenarios against a real Forgejo and a real GitLab CE (D996):
  # test/forge/run.sh starts the pinned container itself, so the same script is
  # the by-hand run. GitLab CE boots in minutes, so this is not on every PR: the
  # release PR, a PR that touches test/forge/ (or this file), and a manual run.
  # Never on main, and not a required check; the release PR is where its result
  # is read.
  forge:
    name: forge (${{ matrix.forge }})
    needs: changes
    if: "!cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.forge == 'true')))"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        forge: [forgejo, gitlab]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: test/forge/run.sh ${{ matrix.forge }}

  # The PR title and body lint (the required `pr-title` check) is its own
  # workflow, pr-title.yml: it re-runs on `edited`, which this one must not (D865).

  # A red main is a signal, not something the next PR discovers (D672): the
  # first failing push opens a `ci-red` issue, later ones comment on it, and the
  # first green push closes it.
  main-status:
    name: main-status
    needs: [test, test-windows, web, demo-edge, docker]
    if: github.event_name == 'push' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RED: ${{ contains(needs.*.result, 'failure') }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          open=$(gh issue list -R "$REPO" --label ci-red --state open --json number -q '.[0].number')
          if [ "$RED" = true ]; then
            body="CI failed on main at $SHA: $RUN"
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$REPO" -b "$body"
            else
              gh label create ci-red -R "$REPO" -c B60205 -d "main is red" 2>/dev/null || true
              gh issue create -R "$REPO" -t "main is red" -l ci-red -b "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$REPO" -c "Green again at $SHA: $RUN"
          fi
