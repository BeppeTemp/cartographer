name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight. Runs on main are never
# cancelled: each merge gets its own record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# On main every job runs, and a red main opens (or updates) a `ci-red` issue.
# On a feature PR `test-windows` runs only when the PR touches a package with
# platform-specific code (D672): at 8-13 minutes it would be the whole wait of
# every PR, but leaving it off every PR let a Windows-only break sit on main for
# two days. The release PR runs everything, so no release ships without it.
jobs:
  # Which of the slower jobs this PR needs. A path filter at the workflow level
  # would leave a required check that never reports, blocking the PR; a job
  # skipped by `if:` reports as passed.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          printf '%s\n' "$files"
          # Not the rebuilt UI bundle: its provenance test is
          # platform-independent and runs on `test`.
          any() { printf '%s\n' "$files" | grep -v '^internal/webui/dist/' | grep -qE "$1" && echo true || echo false; }
          # The release PR runs everything: it is the one full pass over what
          # the merged PRs add up to before a tag.
          if [[ "$HEAD_REF" == release-please--* ]]; then any() { echo true; }; fi
          # Web: the frontend, and the Go server the browser suite drives.
          echo "web=$(any '^(web/|cmd/|internal/|go\.(mod|sum)$|Makefile$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          # Windows: the packages that carry platform-specific files or
          # behaviour (process, service, paths in client configs, git, the
          # execute bit), the installers, and anything named *_windows.go.
          echo "windows=$(any '^(cmd/|internal/(service|provisioning|configurator|clientconfig|agents|execbit|gitx|kb|repoindex|defaults)/|install\.(sh|ps1)$|test/install/|go\.(mod|sum)$|Makefile$|\.github/workflows/ci\.yml$)|_windows(_test)?\.go$')" >> "$GITHUB_OUTPUT"

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Feature PRs leave docs/decisions.md alone; the release PR regenerates
      # it and is the one place its staleness is checked (D328).
      CARTOGRAPHER_STRICT_DECISION_INDEX: ${{ startsWith(github.head_ref, 'release-please--') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The git-backed tests (gitx, kb, bootstrap) need an identity and the
      # "master" initial branch on a bare environment (same setup as the
      # Dockerfile test stage).
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      # One command, the same one CONTRIBUTING.md tells a contributor to run
      # before opening a PR: gofmt + vet + test (documentation gates included,
      # internal/repodocs). Listing the steps separately here is how the two
      # answers to "what must be green" drift apart.
      - run: make gate
      - run: make smoke-http
      - run: make e2e
      - run: make test-install

  # A separate job, deliberately not a matrix leg on `test`: main's branch
  # protection requires a check named literally `test`, and a matrix renames it
  # to `test (ubuntu-latest)` — which silently un-protects the branch.
  test-windows:
    name: test-windows
    needs: changes
    # Push to main, the release PR, and a feature PR that touches
    # platform-specific code (D672). Skipped, it counts as passed for the
    # required check. On push `changes` is skipped, hence `result != success`;
    # a failed `changes` runs it too rather than letting a PR through untested.
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.windows == 'true')"
    runs-on: windows-latest
    defaults:
      run:
        # The Makefile recipes are POSIX shell — fmt-check pipes `gofmt -l` — and
        # the runner's default shell is PowerShell. Git for Windows ships bash.
        shell: bash
    steps:
      # Defender scans every file the git-backed tests create: turning it off
      # took about a fifth off `make gate` (internal/mcpserver 190s -> 155s).
      # The rest of the gap with ubuntu is git process creation. The runner is
      # throwaway.
      - name: Disable Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # make is not in the windows-latest image (MSYS2 ships one but is off
      # PATH), and the gate has to stay the same single command on both legs.
      - name: Install make
        run: choco install make --no-progress
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      # `make gate`, plus install.ps1 end to end: smoke-http, e2e and the POSIX
      # test-install suite are sh harnesses and stay on ubuntu.
      - run: make gate
      # install.ps1 against a local fixture release built from this commit, under
      # both shells a user may run it in: PowerShell 7 and Windows PowerShell 5.1,
      # whose quirks (TLS defaults, native stderr) are the ones that bite (D252).
      - name: install.ps1
        shell: pwsh
        run: |
          go build -ldflags "-X main.version=v9.9.9" -o "$env:RUNNER_TEMP\new\cartographer.exe" ./cmd/cartographer
          go build -ldflags "-X main.version=v9.9.8" -o "$env:RUNNER_TEMP\old\cartographer.exe" ./cmd/cartographer
          foreach ($shell in 'pwsh', 'powershell') {
            ./test/install/windows/run.ps1 -Shell $shell -NewBin "$env:RUNNER_TEMP\new\cartographer.exe" -OldBin "$env:RUNNER_TEMP\old\cartographer.exe"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  # The frontend, deliberately its own job rather than a step of `test`.
  #
  # `make gate` stays Go-only so a contributor changing Go code needs no Node
  # toolchain (D227); what protects the committed bundle there is a pure-Go
  # provenance test in internal/webui. This job is what actually builds the
  # frontend and runs its tests, and it only needs to run when the frontend
  # changed (the `changes` job decides), and after every merge on main, so a
  # browser regression is seen on the merge that caused it (D672). It is a
  # required check: a red `web` blocks the merge like a red `test`.
  web:
    name: web
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-check
      - run: make web-test
      # The browser suite (D228) drives bin/cartographer, which commits to the
      # fixture KBs it initialises, so git needs an identity here too.
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch master
      # The browser binary is cached by Playwright version (D328); the OS
      # packages it needs are not cacheable and are installed every run.
      - id: playwright
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd web && npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: cd web && npx playwright install-deps chromium
      - run: make e2e-web

  # With squash-merge the PR title becomes the commit on main that
  # release-please reads: it must be a valid conventional commit.
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A red main is a signal, not something the next PR discovers (D672): the
  # first failing push opens a `ci-red` issue, later ones comment on it, and the
  # first green push closes it.
  main-status:
    name: main-status
    needs: [test, test-windows, web]
    if: github.event_name == 'push' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RED: ${{ contains(needs.*.result, 'failure') }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          open=$(gh issue list -R "$REPO" --label ci-red --state open --json number -q '.[0].number')
          if [ "$RED" = true ]; then
            body="CI failed on main at $SHA: $RUN"
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$REPO" -b "$body"
            else
              gh label create ci-red -R "$REPO" -c B60205 -d "main is red" 2>/dev/null || true
              gh issue create -R "$REPO" -t "main is red" -l ci-red -b "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$REPO" -c "Green again at $SHA: $RUN"
          fi
