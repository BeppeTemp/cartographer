name: plan-gate

# The size cap of CONTRIBUTING.md §Pull requests, enforced where a
# contributor's agent cannot skip it (D955). The rule itself lives in
# scripts/pr-triage.sh, the single source: this file only runs it, so no threshold
# is duplicated here.
#
# INVARIANTS (pinned by internal/repodocs/plan_gate_test.go):
#   - The trigger is `pull_request_target`: the workflow file and pr-triage.sh come
#     from the BASE branch. A `pull_request` workflow would run the PR's own,
#     possibly edited, copy of both.
#   - It checks out github.sha only — under pull_request_target the tip of the base
#     branch, the same commit the workflow file is read from — never the PR head,
#     and executes nothing from the PR. A fork PR's code never runs with this token.
#     Not pull_request.base.sha: that is the base as of the PR's last push, so after
#     a rename on main the current workflow runs a path the old tree does not have.
#   - Every `uses:` is pinned to a full commit SHA: this is the only workflow that holds
#     the base repository token on fork-triggered events, so a moved tag must not reach it.
#   - Read-only permissions and no secrets.
#
# TRAP: a `pull_request_target` workflow added or changed by a PR does not run
# from that PR (it runs from the base branch): this file starts working on the
# first PR opened after the one that adds it merges.
#
# The ruleset requires the job name `plan-gate` once the maintainer adds it to
# the required checks of `main-protection`.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled] # edited: `Closes #n` is often added later; labeled: the `size-exception` label

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  plan-gate:
    name: plan-gate
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    concurrency:
      group: plan-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The base branch tip, nothing else: see INVARIANTS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Values reach the script through the environment, never interpolated into it.
      - name: Size cap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/pr-triage.sh --gate "$PR"
