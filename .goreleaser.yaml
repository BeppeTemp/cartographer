version: 2

project_name: cartographer

builds:
  - main: ./cmd/cartographer
    binary: cartographer
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # main.version must keep the leading "v" ({{.Version}} strips it): the
    # Makefile injects `git describe` output (v2.1.2) and install.sh compares
    # `cartographer version` against the release tag verbatim.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

# Two shapes, one entry. Darwin and linux stay RAW per-platform binaries
# (cartographer-<os>-<arch>) because that is literally what install.sh downloads
# and then verifies against its line in sha256sums.txt — a missing entry there is
# an error, not a skip, so any rename breaks every existing `install.sh update`.
#
# Windows overrides the format to zip, and that is a requirement rather than a
# preference: GoReleaser's winget pipe derives the installer from the archive. A
# zip yields `InstallerType: zip` + `NestedInstallerType: portable` and a
# `PortableCommandAlias` of `cartographer` (the .exe suffix is trimmed), which is
# the command a user gets on PATH. A raw binary takes the uploadable-binary branch
# instead: `InstallerType: portable`, no alias, and the registered command name is
# `cartographer.exe`. The two cannot be mixed for one platform either — the pipe
# refuses an archive set with both .exe and .zip (errMixedFormats).
#
# The entry has no explicit id on purpose: there is exactly one, so the winget and
# cask blocks consume it without an `ids:` filter, and adding a second archive
# entry is what would make ids necessary.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: sha256sums.txt
  algorithm: sha256

# The GitHub Release is created by release-please with the changelog as body:
# GoReleaser only attaches the binaries and checksums to it.
release:
  mode: keep-existing

# Release notes are owned by release-please (CHANGELOG.md + release body).
changelog:
  disable: true

# Casks are macOS-only: Linux users install via install.sh. The binary target
# defaults to the cask name (cartographer); the downloaded asset keeps its
# platform-suffixed name, hence the recursive quarantine removal on the whole
# staged path (binaries are not notarized).
homebrew_casks:
  - name: cartographer
    repository:
      owner: BeppeTemp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/BeppeTemp/cartographer
    description: "MCP governance server for the Agentic Wiki — persistent, git-backed knowledge bases for LLM agents"
    # The macOS quarantine removal runs as a declarative `postflight_steps`
    # stanza (D199). GoReleaser (2.18.1 and main) still renders
    # `hooks.post.install` as the deprecated `postflight do` block, so the
    # stanza is written verbatim through `custom_block` and no `hooks` are set.
    # These steps run in Homebrew's sandbox — temporary HOME, the real one
    # unreadable, no network — which is why the Cask no longer calls
    # `cartographer upgrade-repair`: the next `cartographer sync` replaces a
    # native service still running the previous binary (D199, amends D121).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}"]
        end
      end

# winget is the ONLY Windows channel: no install.ps1, no Scoop bucket, no
# Chocolatey package — one channel to keep correct (D218). The manifests are
# pushed to our fork on a per-release branch and submitted to the community
# repository as a cross-repo pull request, because `winget install
# BeppeTemp.Cartographer` working out of the box is the entire point; a private
# manifest repository would need `winget source add` first.
#
# `path` is left at its default, which already resolves to
# manifests/<publisher initial>/<publisher>/<name>/<version> — the layout
# winget-pkgs requires. `use:` is deliberately unset: it is a GoReleaser Pro
# field, silently ignored in OSS, and setting it would make the archive choice
# above look configured when it is not.
#
# Trap, and the reason this comment names a file that does not exist: GoReleaser
# uses this repository's .github/PULL_REQUEST_TEMPLATE.md as the body of the
# winget pull request when one is present. There is none today. Adding one for our
# own PRs would start prefixing every winget-pkgs submission with it.
#
# A missing WINGET_PKGS_TOKEN does not fail the release: the winget pipe continues
# on error. It logs and publishes nothing, which is why the token and the fork are
# maintainer prerequisites (deployment.md §CI/CD) rather than release blockers.
winget:
  - name: cartographer
    publisher: BeppeTemp
    package_identifier: BeppeTemp.Cartographer
    # Same wording as the Cask's description, so the two catalogue entries cannot
    # drift into describing different products.
    short_description: "MCP governance server for the Agentic Wiki — persistent, git-backed knowledge bases for LLM agents"
    description: |
      Cartographer is an MCP server that turns a git repository into a knowledge base
      an LLM agent can navigate and write to safely: bounded reads, one commit per
      write, and deterministic validation of every change. The same binary is also the
      client that configures the agent tools installed on this machine.
    license: Apache-2.0
    license_url: "https://github.com/BeppeTemp/cartographer/blob/main/LICENSE"
    copyright: "Copyright 2026 BeppeTemp"
    homepage: "https://github.com/BeppeTemp/cartographer"
    publisher_url: "https://github.com/BeppeTemp"
    publisher_support_url: "https://github.com/BeppeTemp/cartographer/issues"
    release_notes_url: "https://github.com/BeppeTemp/cartographer/releases/tag/v{{ .Version }}"
    tags:
      - mcp
      - model-context-protocol
      - knowledge-base
      - git
      - llm
      - agents
      - documentation
    repository:
      owner: BeppeTemp
      name: winget-pkgs
      # One branch per release: the community repository expects a branch it can
      # review and merge on its own, not a moving target.
      branch: "cartographer-{{ .Version }}"
      token: "{{ .Env.WINGET_PKGS_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
