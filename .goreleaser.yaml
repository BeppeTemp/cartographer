version: 2

project_name: cartographer

builds:
  - main: ./cmd/cartographer
    binary: cartographer
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # main.version must keep the leading "v" ({{.Version}} strips it): the
    # Makefile injects `git describe` output (v2.1.2) and install.sh compares
    # `cartographer version` against the release tag verbatim.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

# Two shapes, one entry. Darwin and linux stay RAW per-platform binaries
# (cartographer-<os>-<arch>) because that is literally what install.sh downloads
# and then verifies against its line in sha256sums.txt — a missing entry there is
# an error, not a skip, so any rename breaks every existing `install.sh update`.
#
# Windows overrides the format to zip: install.ps1 downloads
# cartographer-windows-<arch>.zip, verifies it against its line in
# sha256sums.txt and extracts cartographer.exe from it (D252). Renaming the asset
# or changing the format breaks every existing Windows `install.ps1 update`, the
# same way a rename breaks install.sh.
#
# The entry has no explicit id on purpose: there is exactly one, so the cask
# block consumes it without an `ids:` filter, and adding a second archive entry
# is what would make ids necessary.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: sha256sums.txt
  algorithm: sha256

# The GitHub Release is created by release-please with the changelog as body:
# GoReleaser only attaches the binaries and checksums to it.
release:
  mode: keep-existing

# Release notes are owned by release-please (CHANGELOG.md + release body).
changelog:
  disable: true

# Casks are macOS-only: Linux users install via install.sh. The binary target
# defaults to the cask name (cartographer); the downloaded asset keeps its
# platform-suffixed name, hence the recursive quarantine removal on the whole
# staged path (binaries are not notarized).
homebrew_casks:
  - name: cartographer
    repository:
      owner: BeppeTemp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/BeppeTemp/cartographer
    description: "MCP governance server for the Agentic Wiki — persistent, git-backed knowledge bases for LLM agents"
    # The macOS quarantine removal runs as a declarative `postflight_steps`
    # stanza (D199). GoReleaser (2.18.1 and main) still renders
    # `hooks.post.install` as the deprecated `postflight do` block, so the
    # stanza is written verbatim through `custom_block` and no `hooks` are set.
    # These steps run in Homebrew's sandbox — temporary HOME, the real one
    # unreadable, no network — which is why the Cask no longer calls
    # `cartographer upgrade-repair`: the next `cartographer sync` replaces a
    # native service still running the previous binary (D199, amends D121).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}"]
        end
      end
