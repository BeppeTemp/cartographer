# The recipes block of a worker config for this lister. The Source is registered once:
#   source_register(source_shape: system, recipe: k8s-dev, locator: "kubernetes://dev-cluster", ...)
# The locator is an opaque label; the lister never uses it. The identity and the endpoint come
# from the variables below, set in the worker's environment, never from a KB.
recipes:
  k8s-dev:
    shape: system
    instructions_file: kubernetes/instructions.md
    exec:
      command: python3
      args: ["/etc/cartographer/recipes/kubernetes/lister.py"]
      env:            # NAME the lister sees: name of the worker's variable
        KUBECTL: KUBECTL
        KUBE_CONTEXT: KUBE_CONTEXT
        KUBECONFIG: KUBECONFIG
      timeout: 5m
      max_content_bytes: 65536
