<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartographer launch film</title>
<style>
  html, body { margin: 0; height: 100%; background: #f5f2eb; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
    background: var(--carto-background); transform-origin: 0 0; font-family: var(--carto-font-editorial); color: var(--carto-text); }
  #stage > * { position: absolute; }
  #graph { left: 768px; top: 0; width: 1152px; height: 1080px; opacity: 0; }
  #contours { left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .title { font-size: 72px; line-height: 1.12; letter-spacing: -0.01em; width: 760px; }
  .caption { font-size: 44px; letter-spacing: -0.005em; }
  .day { font-size: 32px; font-style: italic; color: var(--carto-text-muted); }
  .card { background: #191F1C; border-radius: 16px; box-shadow: 0 40px 80px rgba(37,40,36,.22); overflow: hidden; }
  .card .bar { height: 48px; background: #222B25; display: flex; align-items: center; gap: 8px; padding: 0 20px;
    font: 18px var(--carto-font-code); color: #AFB9AE; }
  .card .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3B473E; display: block; }
  .card .bar i.live { background: #91B9A0; }
  .card.clay .bar i.live { background: #D6A68D; }
  .card .bar b { font-weight: normal; margin-left: 10px; }
  .card .body { padding: 22px 26px; font: 20px/30px var(--carto-font-code); color: #EEEDE5; white-space: pre-wrap; word-break: break-word; }
  .card .body .tool { color: #91B9A0; }
  .card .body .err { color: #E9A199; }
  .card .body .cur { display: inline-block; width: 10px; height: 22px; background: #AFB9AE; vertical-align: -4px; margin-left: 2px; }
  .mem { position: absolute; left: 0; top: 48px; }
  .note { width: 200px; height: 56px; box-sizing: border-box; border-radius: 10px; background: #FBF8F1; border: 1px solid #DCDDD5;
    box-shadow: 0 14px 30px rgba(37,40,36,.18); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .note.bad { background: #FCFAF6; border: 2px dashed var(--carto-clay-text); color: var(--carto-clay-text); }
  .tag { font: 16px var(--carto-font-code); color: var(--carto-clay-text); background: var(--carto-background); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--carto-clay-text); }
  #ring { left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #veil { left: 0; top: 0; width: 1920px; height: 1080px; background: var(--carto-background); opacity: 0; }
  .wordmark { font-size: 96px; letter-spacing: -0.02em; white-space: nowrap; }
  .sub { font-size: 36px; color: var(--carto-text-muted); white-space: nowrap; }
  .url { font: 22px var(--carto-font-code); color: var(--carto-text-muted); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
