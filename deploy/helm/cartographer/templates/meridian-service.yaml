{{- include "cartographer.validate" . -}}
{{- if .Values.meridian.enabled -}}
{{- $s := .Values.meridian.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cartographer.fullname" . }}
  labels:
    {{- include "cartographer.labels" (dict "root" . "component" "meridian") | nindent 4 }}
  {{- with $s.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $s.type }}
  selector:
    {{- include "cartographer.selectorLabels" (dict "root" . "component" "meridian") | nindent 4 }}
  ports:
    - name: http
      port: {{ $s.port }}
      targetPort: http
{{- end }}
