{{- include "cartographer.validate" . -}}
{{- if .Values.meridian.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cartographer.fullname" . }}-config
  labels:
    {{- include "cartographer.labels" (dict "root" . "component" "meridian") | nindent 4 }}
data:
  config.yaml: |
    # The next keys are owned by the chart: they are coupled to the container port and the mounts.
    http: ":39273"
    data: /data
    {{- if .Values.meridian.credentials.enabled }}
    credentials_dir: /etc/cartographer-credentials
    {{- end }}
    {{- toYaml .Values.meridian.config | nindent 4 }}
{{- end }}
