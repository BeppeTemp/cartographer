{{- include "cartographer.validate" . -}}{{- include "cartographer.validateMeridian" . -}}
{{- if .Values.meridian.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cartographer.fullname" . }}-config
  labels:
    {{- include "cartographer.labels" (dict "root" . "component" "meridian") | nindent 4 }}
data:
  config.yaml: |
    # The next keys are owned by the chart: they are coupled to the container port and the mounts.
    http: ":39273"
    data: /data
    web:
      enabled: {{ .Values.atlas.enabled }}
    {{- if or .Values.meridian.credentials.enabled .Values.meridian.tls.secretName }}
    credentials_dir: /etc/cartographer-credentials
    {{- end }}
    {{- $cfg := deepCopy .Values.meridian.config }}
    {{- if .Values.meridian.tls.secretName }}
    {{- /* tls.enabled and tls.health_addr are chart-owned with a TLS Secret (the probes read them); the other tls keys pass through. */}}
    {{- $tls := default (dict) (get $cfg "tls") }}
    {{- $_ := set $tls "enabled" true }}
    {{- $_ := set $tls "health_addr" (printf "127.0.0.1:%v" .Values.meridian.tls.healthPort) }}
    {{- $_ := set $cfg "tls" $tls }}
    {{- end }}
    {{- toYaml $cfg | nindent 4 }}
{{- end }}
