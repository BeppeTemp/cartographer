# Partitioned: one release per server, each with its own KBs and host. The pair is rendered
# under two release names and no (kind, name) may repeat.
fullnameOverride: cartographer-a
server:
  tokens:
    existingSecret:
      name: cartographer-a-tokens
  credentials:
    enabled: false
  config:
    auth:
      mode: "on"
    kbs:
      - remote: https://git.example.com/user/kb-a.git
  ingress:
    enabled: true
    hosts:
      - host: wiki-a.example.com
